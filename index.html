<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>時間割 — TestTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ===== Variables ===== */
:root {
  --bg:        #0c0e14;
  --surface:   #141720;
  --surface2:  #1c2030;
  --surface3:  #242840;
  --border:    #2a2f45;
  --border2:   #353b55;
  --text:      #dde1f0;
  --muted:     #6b7291;
  --accent:    #5b8af0;
  --accent2:   #3d6fe0;
  --accent-bg: rgba(91,138,240,.12);
  --accent-glow: rgba(91,138,240,.28);
  --green:     #3ecf8e;
  --green-bg:  rgba(62,207,142,.12);
  --red:       #f06b6b;
  --red-bg:    rgba(240,107,107,.1);
  --yellow:    #f0c46b;
  --yellow-bg: rgba(240,196,107,.1);

  --r:    10px;
  --r-sm: 6px;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
  --trans: 160ms cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:15px; }
body {
  background:var(--bg); color:var(--text);
  font-family:"Zen Kaku Gothic New",sans-serif;
  min-height:100dvh; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 800px 500px at 15% 0%,rgba(91,138,240,.07) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 85% 90%,rgba(62,207,142,.05) 0%,transparent 70%);
  pointer-events:none; z-index:0;
}

/* ===== Page router ===== */
.page { position:relative; z-index:1; display:none; }
.page.active { display:block; }

/* ===== Header ===== */
.page-header {
  display:flex; align-items:center; gap:10px;
  padding:28px 20px 16px; max-width:1100px; margin:0 auto;
  flex-wrap:wrap;
}
.back-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border2); background:var(--surface);
  color:var(--muted); font-size:17px; cursor:pointer;
  transition:var(--trans); text-decoration:none; flex-shrink:0;
}
.back-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); }
.page-title {
  font-family:"Kaisei Decol",serif; font-size:22px; font-weight:700; letter-spacing:.02em;
}
.page-title span { color:var(--accent); }
.header-right {
  margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
}

/* ===== Button ===== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  padding:8px 16px; border-radius:var(--r-sm); font-family:inherit;
  font-size:13px; font-weight:700; cursor:pointer; transition:var(--trans);
  border:none; outline:none; letter-spacing:.03em; white-space:nowrap;
}
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 16px rgba(91,138,240,.35); }
.btn-primary:not(:disabled):hover { background:var(--accent2); box-shadow:0 6px 20px rgba(91,138,240,.5); }
.btn-ghost { background:var(--surface2); border:1px solid var(--border2); color:var(--muted); }
.btn-ghost:not(:disabled):hover { color:var(--text); background:var(--surface3); border-color:var(--border2); }
.btn-danger { background:var(--red-bg); border:1px solid var(--red); color:var(--red); }
.btn-danger:not(:disabled):hover { background:var(--red); color:#fff; }
.btn-sm { padding:5px 11px; font-size:12px; }

/* ===== Timetable ===== */
.tt-wrap {
  max-width:1100px; margin:0 auto; padding:0 16px 80px;
  overflow-x:auto;
}

/* date strip */
.date-strip {
  display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
}
.date-chip {
  font-size:11px; font-family:"JetBrains Mono",monospace;
  padding:4px 10px; border-radius:999px;
  background:var(--surface2); border:1px solid var(--border2); color:var(--muted);
}
.date-chip strong { color:var(--text); }
.strip-summary {
  font-size:11px; color:var(--muted); margin-left:auto;
  font-family:"JetBrains Mono",monospace;
}

/* grid */
.tt-grid {
  display:grid;
  grid-template-columns: 52px repeat(5, 1fr);
  gap:6px;
  min-width:480px;
}
.tt-col-head {
  text-align:center; padding:10px 4px;
  font-size:13px; font-weight:700; letter-spacing:.04em;
  border-radius:var(--r-sm);
  border-bottom:2px solid var(--color, var(--border2));
  color:var(--color, var(--muted));
  background:var(--color-bg, var(--surface2));
}
.tt-col-head .wday { font-size:18px; }
.tt-period {
  display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace;
  font-size:12px; color:var(--muted);
}
.tt-cell {
  border-radius:var(--r); border:1px solid var(--border);
  background:var(--surface2);
  min-height:80px; position:relative; overflow:hidden;
  transition:border-color var(--trans), transform var(--trans), box-shadow var(--trans);
}
.tt-cell.empty {
  background:transparent; border-color:var(--border); opacity:.35;
}
.tt-cell.has-subject {
  cursor:pointer;
  border-color:var(--subject-color, var(--accent));
  background:var(--surface);
}
.tt-cell.has-subject::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--subject-color, var(--accent));
  border-radius:3px 0 0 3px;
}
.tt-cell.has-subject:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,0,0,.4);
  background:var(--surface3);
}
.tt-cell.has-subject:active { transform:translateY(0); }
.cell-inner { padding:10px 10px 10px 14px; height:100%; display:flex; flex-direction:column; gap:4px; }
.cell-name { font-size:13px; font-weight:700; line-height:1.3; }
.cell-meta { font-size:10px; color:var(--muted); font-family:"JetBrains Mono",monospace; }
.cell-badge {
  margin-top:auto;
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-family:"JetBrains Mono",monospace;
  padding:2px 7px; border-radius:999px;
  background:var(--subject-color-bg, var(--accent-bg));
  border:1px solid var(--subject-color-border, var(--accent-glow));
  color:var(--subject-color, var(--accent));
  width:fit-content;
}
.cell-exam-dot {
  position:absolute; top:8px; right:8px;
  width:8px; height:8px; border-radius:50%;
  background:var(--yellow); box-shadow:0 0 6px rgba(240,196,107,.6);
}

/* ===== Empty state ===== */
.empty-state {
  text-align:center; padding:80px 24px;
  color:var(--muted); line-height:2;
}
.empty-icon { font-size:48px; margin-bottom:16px; }
.empty-title { font-family:"Kaisei Decol",serif; font-size:20px; color:var(--text); margin-bottom:8px; }

/* ===== Exam input page ===== */
.exam-wrap { max-width:680px; margin:0 auto; padding:0 20px 80px; }
.subject-info-card {
  background:var(--surface); border:1px solid var(--border);
  border-left:4px solid var(--subject-color, var(--accent));
  border-radius:var(--r); padding:16px 20px; margin-bottom:20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.sic-name { font-size:17px; font-weight:700; }
.sic-meta { font-size:12px; color:var(--muted); margin-top:3px; font-family:"JetBrains Mono",monospace; }
.sic-badge {
  margin-left:auto; flex-shrink:0;
  font-size:11px; padding:4px 12px; border-radius:999px;
  background:var(--accent-bg); border:1px solid var(--accent-glow); color:var(--accent);
  font-family:"JetBrains Mono",monospace;
}
.form-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:22px; margin-bottom:14px;
}
.form-section-title {
  font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.form-section-title::before {
  content:''; display:inline-block; width:3px; height:13px;
  background:var(--accent); border-radius:2px;
}
.field { margin-bottom:13px; }
label { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.06em; margin-bottom:5px; }
input[type=text], input[type=date], input[type=time], select, textarea {
  width:100%; padding:9px 12px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:var(--r-sm); color:var(--text);
  font-family:inherit; font-size:14px;
  transition:border-color var(--trans), box-shadow var(--trans);
  outline:none; appearance:none;
}
input:focus, select:focus, textarea:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);
}
input.error { border-color:var(--red) !important; box-shadow:0 0 0 3px rgba(240,107,107,.2) !important; }
input.warn  { border-color:var(--yellow) !important; box-shadow:0 0 0 3px rgba(240,196,107,.2) !important; }
.field-msg { font-size:11px; margin-top:4px; padding-left:2px; }
.field-msg.error { color:var(--red); }
.field-msg.warn  { color:var(--yellow); }
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator { filter:invert(.5); cursor:pointer; }
select option { background:var(--surface2); }
textarea { resize:vertical; min-height:72px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.type-group { display:flex; gap:6px; flex-wrap:wrap; }
.type-btn {
  padding:7px 14px; border-radius:var(--r-sm);
  border:1px solid var(--border2); background:var(--surface2);
  color:var(--muted); font-family:inherit; font-size:13px; font-weight:500;
  cursor:pointer; transition:var(--trans);
}
.type-btn:hover { background:var(--surface3); color:var(--text); }
.type-btn.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }

/* exam list */
.exam-list { display:flex; flex-direction:column; gap:8px; }
.exam-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); padding:12px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  animation:fadeUp .22s ease both;
}
.ec-type-badge {
  flex-shrink:0; font-size:11px; padding:3px 10px; border-radius:999px;
  font-family:"JetBrains Mono",monospace; font-weight:500; white-space:nowrap;
}
.ec-type-badge.中間テスト { background:rgba(91,138,240,.2);  border:1px solid rgba(91,138,240,.4);  color:#5b8af0; }
.ec-type-badge.期末テスト { background:rgba(240,107,107,.2); border:1px solid rgba(240,107,107,.4); color:#f06b6b; }
.ec-type-badge.小テスト   { background:rgba(62,207,142,.2);  border:1px solid rgba(62,207,142,.4);  color:#3ecf8e; }
.ec-type-badge.定期テスト { background:rgba(240,196,107,.2); border:1px solid rgba(240,196,107,.4); color:#f0c46b; }
.ec-info { flex:1; min-width:0; }
.ec-date { font-size:13px; font-weight:700; font-family:"JetBrains Mono",monospace; }
.ec-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.ec-del {
  padding:5px 10px; border-radius:var(--r-sm);
  background:var(--red-bg); border:1px solid var(--red); color:var(--red);
  font-size:12px; cursor:pointer; transition:var(--trans); font-family:inherit; flex-shrink:0;
}
.ec-del:hover { background:var(--red); color:#fff; }
.form-actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }

/* ===== Modal ===== */
.modal-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.72); backdrop-filter:blur(5px);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.modal-overlay.active { opacity:1; pointer-events:all; }
.modal-box {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--r); padding:28px; max-width:440px; width:100%;
  box-shadow:var(--shadow);
  transform:scale(.96) translateY(8px);
  transition:transform .22s cubic-bezier(.34,1.36,.64,1);
}
.modal-overlay.active .modal-box { transform:scale(1) translateY(0); }
.modal-title {
  font-family:"Kaisei Decol",serif; font-size:17px; margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.modal-title .modal-icon { font-size:20px; }
.modal-body { font-size:13px; color:var(--muted); line-height:1.8; margin-bottom:20px; }
.modal-body strong { color:var(--text); }
.modal-stat-row {
  display:flex; gap:10px; margin:12px 0;
}
.modal-stat {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:10px 14px; text-align:center;
}
.modal-stat-val { font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; color:var(--accent); }
.modal-stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }
.modal-warn {
  background:var(--yellow-bg); border:1px solid rgba(240,196,107,.3);
  border-radius:var(--r-sm); padding:10px 14px;
  font-size:12px; color:var(--yellow); line-height:1.6;
  margin-bottom:16px;
}
.modal-actions { display:flex; gap:8px; flex-wrap:wrap; }
.modal-divider {
  border:none; border-top:1px solid var(--border);
  margin:0 0 16px;
}

/* ===== Import/Export toolbar ===== */
.data-toolbar {
  display:flex; gap:6px; align-items:center;
  padding:10px 16px; max-width:1100px; margin:0 auto 8px;
  background:var(--surface2); border-radius:var(--r-sm);
  border:1px solid var(--border);
}
.data-toolbar-label {
  font-size:11px; color:var(--muted); margin-right:4px; font-family:"JetBrains Mono",monospace;
}

/* ===== Toast ===== */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--surface2); border:1px solid var(--border2);
  padding:10px 20px; border-radius:999px;
  font-size:13px; font-weight:500; color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  opacity:0; pointer-events:none; z-index:999; white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.success { border-color:var(--green);  color:var(--green); }
.toast.error   { border-color:var(--red);    color:var(--red);   }
.toast.warn    { border-color:var(--yellow); color:var(--yellow);}

/* ===== Animations ===== */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes popIn {
  from { opacity:0; transform:scale(.96) translateY(10px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.tt-cell.has-subject { animation:popIn .28s ease both; }

/* ===== Responsive ===== */
@media (max-width:600px) {
  .tt-grid { gap:4px; }
  .cell-inner { padding:7px 7px 7px 11px; }
  .cell-name { font-size:11px; }
  .cell-meta, .cell-badge { display:none; }
  .form-row { grid-template-columns:1fr; }
  .header-right { gap:4px; }
}
</style>
</head>
<body>

<!-- ==================== PAGE: TIMETABLE ==================== -->
<div class="page active" id="page-timetable">
  <div class="page-header">
    <h1 class="page-title">時間<span>割</span> — TestTrack</h1>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="exportData()" title="全データをJSONでダウンロード">↓ エクスポート</button>
      <button class="btn btn-ghost btn-sm" onclick="triggerImport()" title="JSONファイルから読み込む">↑ インポート</button>
      <button class="btn btn-primary btn-sm" onclick="navigate('exam', null)">＋ テスト入力</button>
    </div>
  </div>

  <div class="tt-wrap">
    <div class="date-strip" id="dateStrip"></div>
    <div class="tt-grid" id="ttGrid"></div>
    <div class="empty-state" id="ttEmpty" style="display:none">
      <div class="empty-icon">📋</div>
      <div class="empty-title">授業が登録されていません</div>
      <p>サンプルデータを読み込んで試すか、授業を登録してください。</p>
      <br>
      <button class="btn btn-primary" onclick="loadSampleData()">時間割を読み込む</button>
    </div>
  </div>
</div>

<!-- ==================== PAGE: EXAM INPUT ==================== -->
<div class="page" id="page-exam">
  <div class="page-header">
    <button class="back-btn" onclick="navigate('timetable')" title="時間割へ">←</button>
    <h1 class="page-title">テスト<span>入力</span></h1>
  </div>

  <div class="exam-wrap">
    <div class="subject-info-card" id="examSubjectCard" style="--subject-color:var(--accent)">
      <div style="flex:1;min-width:0">
        <div class="sic-name" id="examSubjectName">—</div>
        <div class="sic-meta" id="examSubjectMeta">—</div>
      </div>
      <div class="sic-badge" id="examSubjectBadge">—</div>
    </div>

    <div class="form-card">
      <div class="form-section-title">テストを追加</div>

      <div class="field">
        <label>テスト種別 *</label>
        <div class="type-group" id="typeGroup">
          <button class="type-btn active" data-type="中間テスト">中間テスト</button>
          <button class="type-btn" data-type="期末テスト">期末テスト</button>
          <button class="type-btn" data-type="小テスト">小テスト</button>
          <button class="type-btn" data-type="定期テスト">定期テスト</button>
        </div>
      </div>

      <div class="field">
        <label>テスト日 *</label>
        <input type="date" id="examDate" oninput="validateDateField()" />
        <div class="field-msg" id="examDateMsg"></div>
      </div>

      <div class="form-row">
        <div class="field">
          <label>開始時刻</label>
          <input type="time" id="examStart" oninput="validateTimeFields()" />
        </div>
        <div class="field">
          <label>終了時刻</label>
          <input type="time" id="examEnd" oninput="validateTimeFields()" />
          <div class="field-msg" id="examTimeMsg"></div>
        </div>
      </div>

      <div class="field">
        <label>会場・教室</label>
        <input type="text" id="examRoom" placeholder="例: 3F 301教室" maxlength="40" />
      </div>

      <div class="field">
        <label>メモ</label>
        <textarea id="examNote" placeholder="範囲・持ち物など" maxlength="300"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="saveExamBtn" onclick="saveExam()">＋ テストを追加</button>
        <button class="btn btn-ghost" onclick="navigate('timetable')">キャンセル</button>
      </div>
    </div>

    <div class="form-card" id="existingExamsCard">
      <div class="form-section-title" style="justify-content:space-between">
        <span>登録済みテスト</span>
        <span id="examCountBadge" style="font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0"></span>
      </div>
      <div class="exam-list" id="examList"></div>
    </div>
  </div>
</div>

<!-- ==================== MODAL: IMPORT ==================== -->
<div class="modal-overlay" id="importModal">
  <div class="modal-box">
    <div class="modal-title"><span class="modal-icon">📥</span>データの読み込み</div>
    <div class="modal-body">
      <p>ファイルに含まれるデータ:</p>
      <div class="modal-stat-row">
        <div class="modal-stat">
          <div class="modal-stat-val" id="modalSubCount">0</div>
          <div class="modal-stat-lbl">授業</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-val" id="modalExamCount">0</div>
          <div class="modal-stat-lbl">テスト</div>
        </div>
      </div>
      <div class="modal-warn" id="modalWarnBox" style="display:none"></div>
      <hr class="modal-divider">
      <p id="modalExistingMsg"></p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modalOverwriteBtn" onclick="confirmImport('overwrite')">上書き</button>
      <button class="btn btn-ghost"   id="modalMergeBtn"     onclick="confirmImport('merge')">マージ</button>
      <button class="btn btn-ghost"   onclick="closeModal('importModal')">キャンセル</button>
    </div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)" />

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

// ============================================================
// Constants & Storage
// ============================================================
const KEYS = {
  SUBJECTS: 'exam_app:subjects',
  EXAMS:    'exam_app:exams',
};

const WEEKDAYS   = ['月','火','水','木','金'];
const JS_DAY     = { '月':1,'火':2,'水':3,'木':4,'金':5 };
const EXAM_TYPES = ['中間テスト','期末テスト','小テスト','定期テスト'];

const WD_COLORS = {
  '月': { color:'#5b8af0', bg:'rgba(91,138,240,.1)' },
  '火': { color:'#3ecf8e', bg:'rgba(62,207,142,.1)' },
  '水': { color:'#f0c46b', bg:'rgba(240,196,107,.1)' },
  '木': { color:'#c97af0', bg:'rgba(201,122,240,.1)' },
  '金': { color:'#f07a5b', bg:'rgba(240,122,91,.1)'  },
};

// In-memory state
let subjects = [];
let exams    = [];
let currentSubjectId = null;
let selectedExamType = EXAM_TYPES[0];
let pendingImport    = null;

// ============================================================
// Storage helpers
// ============================================================
function loadAll() {
  try { subjects = JSON.parse(localStorage.getItem(KEYS.SUBJECTS) || '[]'); }
  catch { subjects = []; }
  try { exams    = JSON.parse(localStorage.getItem(KEYS.EXAMS)    || '[]'); }
  catch { exams = []; }
}

function persistSubjects() { localStorage.setItem(KEYS.SUBJECTS, JSON.stringify(subjects)); }
function persistExams()    { localStorage.setItem(KEYS.EXAMS,    JSON.stringify(exams));    }

function genId() {
  return (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ============================================================
// Date utilities — single source of truth
// ============================================================
/** 'YYYY-MM-DD' from Date */
function toISO(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

/** Date from 'YYYY-MM-DD' (local time) */
function parseISO(iso) {
  if (!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}

/** Today as 'YYYY-MM-DD' */
function todayISO() { return toISO(new Date()); }

/** '2025/06/14(土)' display format */
function fmtDate(iso) {
  if (!iso) return '—';
  const d = parseISO(iso);
  if (!d) return iso;
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}(${wd})`;
}

/** 'HH:MM〜HH:MM' or 'HH:MM' */
function fmtTime(start, end) {
  if (!start) return '';
  return end ? `${start}〜${end}` : start;
}

/** Returns true if iso is valid YYYY-MM-DD */
const ISO_RE   = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE  = /^\d{2}:\d{2}$/;
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;

function isValidISO(s)  { return ISO_RE.test(s)  && !isNaN(parseISO(s)); }
function isValidTime(s) { return TIME_RE.test(s); }

// ============================================================
// Occurrence logic
// ============================================================
function nextOccurrenceDates(s, count = 1) {
  return getNthFrom(s.startDate, s.weekday, s.holidays || [], todayISO(), count);
}

function getNthFrom(startDate, weekday, holidays, fromDate, count) {
  const targetDay = JS_DAY[weekday];
  const hSet = new Set(holidays);
  const from = parseISO(fromDate) || parseISO(startDate);
  if (!from) return [];
  const cur = new Date(from);
  while (cur.getDay() !== targetDay) cur.setDate(cur.getDate() + 1);
  const result = [];
  let guard = 0;
  while (result.length < count && guard++ < 1000) {
    const iso = toISO(cur);
    if (!hSet.has(iso)) result.push(iso);
    cur.setDate(cur.getDate() + 7);
  }
  return result;
}

function getOccurrenceNumber(s, date) {
  const targetDay = JS_DAY[s.weekday];
  const hSet = new Set(s.holidays || []);
  const start = parseISO(s.startDate);
  if (!start) return null;
  const cur = new Date(start);
  while (cur.getDay() !== targetDay) cur.setDate(cur.getDate() + 1);
  let count = 0;
  let guard = 0;
  while (guard++ < 1000) {
    const iso = toISO(cur);
    if (!hSet.has(iso)) count++;
    if (iso === date) return count;
    if (iso > date) return null;
    cur.setDate(cur.getDate() + 7);
  }
  return null;
}

// ============================================================
// HTML utility
// ============================================================
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ============================================================
// Router
// ============================================================
function navigate(route, subjectId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + route).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (route === 'timetable') renderTimetable();
  if (route === 'exam')      renderExamPage(subjectId ?? null);
}

// ============================================================
// Timetable
// ============================================================
function renderTimetable() {
  loadAll();

  // Date strip
  const strip = document.getElementById('dateStrip');
  strip.innerHTML = `<div class="date-chip">今日 <strong>${fmtDate(todayISO())}</strong></div>`;
  if (subjects.length) {
    strip.innerHTML += `<span class="strip-summary">授業 ${subjects.length}件 ／ テスト ${exams.length}件</span>`;
  }

  const grid  = document.getElementById('ttGrid');
  const empty = document.getElementById('ttEmpty');

  if (!subjects.length) {
    grid.style.display  = 'none';
    empty.style.display = '';
    return;
  }
  grid.style.display  = 'grid';
  empty.style.display = 'none';

  const maxPeriod = Math.max(...subjects.map(s => s.period), 5);

  // Build weekday×period lookup
  const lookup = {};
  subjects.forEach(s => {
    (lookup[s.weekday] = lookup[s.weekday] || {})[s.period] = s;
  });

  // Build upcoming exam lookup: subjectId → earliest future exam
  const today = todayISO();
  const upcomingExam = {};
  exams.forEach(e => {
    if (e.date >= today) {
      if (!upcomingExam[e.subjectId] || e.date < upcomingExam[e.subjectId].date) {
        upcomingExam[e.subjectId] = e;
      }
    }
  });

  // Subjects that already have exams registered
  const examSubjectIds = new Set(exams.map(e => e.subjectId));

  let html = `<div></div>`; // corner

  // Column headers
  WEEKDAYS.forEach(wd => {
    const c = WD_COLORS[wd];
    html += `<div class="tt-col-head" style="--color:${c.color};--color-bg:${c.bg}">
      <div class="wday">${wd}</div>
    </div>`;
  });

  for (let pd = 1; pd <= maxPeriod; pd++) {
    html += `<div class="tt-period">${pd}限</div>`;
    WEEKDAYS.forEach(wd => {
      const s = lookup[wd]?.[pd];
      if (!s) { html += `<div class="tt-cell empty"></div>`; return; }

      const color       = s.color || '#5b8af0';
      const colorBg     = hexToRgba(color, .12);
      const colorBorder = hexToRgba(color, .35);
      const nextDates   = nextOccurrenceDates(s, 1);
      const nextDate    = nextDates[0] || null;
      const nextN       = nextDate ? getOccurrenceNumber(s, nextDate) : null;
      const hasExam     = examSubjectIds.has(s.id);
      const nextExam    = upcomingExam[s.id] || null;

      html += `<div class="tt-cell has-subject"
          style="--subject-color:${color};--subject-color-bg:${colorBg};--subject-color-border:${colorBorder}"
          onclick="navigate('exam','${esc(s.id)}')"
          title="${esc(s.name)} — クリックでテスト入力">
        ${hasExam ? '<div class="cell-exam-dot" title="テスト登録済"></div>' : ''}
        <div class="cell-inner">
          <div class="cell-name">${esc(s.name)}</div>
          ${nextDate
            ? `<div class="cell-meta">次: ${fmtDate(nextDate)}</div>`
            : `<div class="cell-meta" style="color:var(--red)">次回なし</div>`}
          ${nextExam
            ? `<div class="cell-badge" title="${esc(nextExam.note||nextExam.type)}">📝 ${fmtDate(nextExam.date)}</div>`
            : nextN !== null
              ? `<div class="cell-badge">第${nextN}回</div>`
              : ''}
        </div>
      </div>`;
    });
  }

  grid.innerHTML = html;
  document.querySelectorAll('.tt-cell.has-subject').forEach((el, i) => {
    el.style.animationDelay = `${i * 25}ms`;
  });
}

// ============================================================
// Exam page
// ============================================================
document.getElementById('typeGroup').addEventListener('click', e => {
  const btn = e.target.closest('.type-btn');
  if (!btn) return;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedExamType = btn.dataset.type;
});

function renderExamPage(subjectId) {
  loadAll();
  currentSubjectId = subjectId;

  const card   = document.getElementById('examSubjectCard');
  const nameEl = document.getElementById('examSubjectName');
  const metaEl = document.getElementById('examSubjectMeta');
  const badge  = document.getElementById('examSubjectBadge');

  if (subjectId) {
    const s = subjects.find(s => s.id === subjectId);
    if (s) {
      const color = s.color || '#5b8af0';
      card.style.setProperty('--subject-color', color);
      nameEl.textContent = s.name;
      metaEl.textContent = `${s.weekday}曜 ${s.period}限 ／ 開始: ${fmtDate(s.startDate)} ／ 休み${(s.holidays||[]).length}日`;
      badge.textContent  = `${s.weekday} ${s.period}限`;

      // Pre-fill date with next occurrence
      const dateInput = document.getElementById('examDate');
      if (!dateInput.value) {
        const next = nextOccurrenceDates(s, 1);
        if (next[0]) dateInput.value = next[0];
      }
    } else {
      nameEl.textContent = '(授業が見つかりません)';
      metaEl.textContent = '授業データが削除された可能性があります';
      badge.textContent  = '不明';
      card.style.setProperty('--subject-color', 'var(--red)');
    }
  } else {
    card.style.setProperty('--subject-color', 'var(--accent)');
    nameEl.textContent = 'すべての授業対象';
    metaEl.textContent = '授業を指定せずにテストを追加します';
    badge.textContent  = '未指定';
  }

  clearFormMessages();
  renderExamList();
}

function renderExamList() {
  const list    = document.getElementById('examList');
  const badge   = document.getElementById('examCountBadge');
  const filtered = currentSubjectId
    ? exams.filter(e => e.subjectId === currentSubjectId)
    : [...exams];

  filtered.sort((a, b) => a.date.localeCompare(b.date));
  badge.textContent = filtered.length ? `${filtered.length}件` : '';

  if (!filtered.length) {
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0;">まだテストが登録されていません</div>`;
    return;
  }

  list.innerHTML = filtered.map(e => {
    const s   = subjects.find(s => s.id === e.subjectId);
    const sub = s ? esc(s.name) : '(削除済み授業)';
    const time = fmtTime(e.startTime, e.endTime);
    const parts = [sub, time, e.room ? esc(e.room) : ''].filter(Boolean).join(' ／ ');
    const isPast = e.date < todayISO();
    return `<div class="exam-card" style="${isPast ? 'opacity:.6' : ''}">
      <span class="ec-type-badge ${esc(e.type)}">${esc(e.type)}</span>
      <div class="ec-info">
        <div class="ec-date">${fmtDate(e.date)}${isPast ? ' <span style="color:var(--muted);font-size:10px">済</span>' : ''}</div>
        <div class="ec-meta">${parts}</div>
        ${e.note ? `<div class="ec-meta" style="margin-top:2px">${esc(e.note)}</div>` : ''}
      </div>
      <button class="ec-del" onclick="deleteExam('${esc(e.id)}')">削除</button>
    </div>`;
  }).join('');
}

// ---- Validation helpers ----
function clearFormMessages() {
  ['examDate','examStart','examEnd'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('error','warn');
  });
  ['examDateMsg','examTimeMsg'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = ''; el.className = 'field-msg'; }
  });
}

function setMsg(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg; el.className = `field-msg ${type}`;
}

function validateDateField() {
  const val = document.getElementById('examDate').value;
  clearFormMessages();
  if (!val) return;
  if (val < todayISO()) {
    document.getElementById('examDate').classList.add('warn');
    setMsg('examDateMsg', '⚠ 過去の日付です', 'warn');
  }
}

function validateTimeFields() {
  const s = document.getElementById('examStart').value;
  const e = document.getElementById('examEnd').value;
  document.getElementById('examStart').classList.remove('error','warn');
  document.getElementById('examEnd').classList.remove('error','warn');
  setMsg('examTimeMsg','','');

  if (e && !s) {
    document.getElementById('examStart').classList.add('error');
    document.getElementById('examEnd').classList.add('error');
    setMsg('examTimeMsg','開始時刻が未入力です','error');
    return false;
  }
  if (s && e && s >= e) {
    document.getElementById('examEnd').classList.add('warn');
    setMsg('examTimeMsg','⚠ 終了時刻が開始時刻以前です','warn');
  }
  return true;
}

function isDuplicateExam(subjectId, date, type, excludeId) {
  return exams.some(e =>
    e.id !== excludeId &&
    e.subjectId === (subjectId || '') &&
    e.date === date &&
    e.type === type
  );
}

function saveExam() {
  const date  = document.getElementById('examDate').value;
  const start = document.getElementById('examStart').value;
  const end   = document.getElementById('examEnd').value;

  clearFormMessages();

  // Required: date
  if (!date) {
    document.getElementById('examDate').classList.add('error');
    setMsg('examDateMsg','テスト日は必須です','error');
    document.getElementById('examDate').focus();
    return;
  }

  // Time consistency
  if (end && !start) {
    document.getElementById('examStart').classList.add('error');
    setMsg('examTimeMsg','開始時刻を入力してください','error');
    return;
  }

  if (!validateTimeFields()) return;

  // Duplicate check
  if (isDuplicateExam(currentSubjectId, date, selectedExamType, null)) {
    if (!confirm(`同じ授業・日付・種別のテストがすでに存在します。\n重複して追加しますか？`)) return;
  }

  const exam = {
    id:        genId(),
    subjectId: currentSubjectId || '',
    type:      selectedExamType,
    date,
    ...(start && { startTime: start }),
    ...(end   && { endTime:   end   }),
    ...(document.getElementById('examRoom').value.trim() && {
          room: document.getElementById('examRoom').value.trim() }),
    ...(document.getElementById('examNote').value.trim() && {
          note: document.getElementById('examNote').value.trim().slice(0, 300) }),
  };

  exams.push(exam);
  persistExams();

  // Reset fields (keep date & subject context)
  ['examStart','examEnd','examRoom'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('examNote').value = '';
  clearFormMessages();

  renderExamList();
  showToast('テストを追加しました ✓', 'success');
}

function deleteExam(id) {
  if (!confirm('このテスト日程を削除しますか？')) return;
  exams = exams.filter(e => e.id !== id);
  persistExams();
  renderExamList();
  showToast('削除しました');
}

// ============================================================
// Export
// ============================================================
function exportData() {
  loadAll();
  const payload = {
    _meta: {
      version:    2,
      app:        'TestTrack',
      exportedAt: new Date().toISOString(),
      counts:     { subjects: subjects.length, exams: exams.length },
    },
    subjects,
    exams,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `testtrack_${todayISO().replace(/-/g,'')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(`エクスポート完了: 授業${subjects.length}件 / テスト${exams.length}件`, 'success');
}

// ============================================================
// Import
// ============================================================
function triggerImport() {
  document.getElementById('importFile').value = '';
  document.getElementById('importFile').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    let raw;
    try { raw = JSON.parse(e.target.result); }
    catch { return showToast('JSONの解析に失敗しました', 'error'); }

    const result = validateImportPayload(raw);

    if (!result.valid) {
      showToast(`形式エラー: ${result.fatalErrors[0]}`, 'error');
      console.error('Import fatal errors:', result.fatalErrors);
      return;
    }

    pendingImport = result;

    loadAll();
    const hasExisting = subjects.length > 0 || exams.length > 0;

    document.getElementById('modalSubCount').textContent  = result.subjects.length;
    document.getElementById('modalExamCount').textContent = result.exams.length;

    const warnBox = document.getElementById('modalWarnBox');
    if (result.warnings.length) {
      warnBox.style.display = '';
      warnBox.textContent   = `⚠ ${result.warnings.length}件のデータをスキップしました: ${result.warnings[0]}`;
    } else {
      warnBox.style.display = 'none';
    }

    const msg = document.getElementById('modalExistingMsg');
    if (hasExisting) {
      msg.innerHTML = `現在 <strong>${subjects.length}</strong> 件の授業と <strong>${exams.length}</strong> 件のテストが登録されています。<br>
        <strong>上書き</strong>: 既存データを完全に置き換えます。<br>
        <strong>マージ</strong>: IDが一致するデータは新しい方で更新し、ないものを追加します。`;
      document.getElementById('modalMergeBtn').style.display = '';
    } else {
      msg.textContent = '既存データはありません。そのまま読み込みます。';
      document.getElementById('modalMergeBtn').style.display = 'none';
    }

    openModal('importModal');
  };
  reader.readAsText(file);
}

/**
 * Validates import payload.
 * Returns { valid, subjects, exams, warnings, fatalErrors }
 */
function validateImportPayload(raw) {
  const fatalErrors = [];
  const warnings    = [];

  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    return { valid: false, fatalErrors: ['ルートがオブジェクトではありません'], warnings, subjects: [], exams: [] };
  }
  if (!Array.isArray(raw.subjects)) {
    fatalErrors.push('"subjects" 配列が見つかりません');
  }
  if (!Array.isArray(raw.exams)) {
    fatalErrors.push('"exams" 配列が見つかりません');
  }
  if (fatalErrors.length) return { valid: false, fatalErrors, warnings, subjects: [], exams: [] };

  const WDAY_SET = new Set(WEEKDAYS);
  const TYPE_SET = new Set(EXAM_TYPES);

  // Validate subjects
  const validSubjects = [];
  raw.subjects.forEach((s, i) => {
    const label = `subjects[${i}]`;
    if (!s.id || typeof s.id !== 'string') { warnings.push(`${label}: id が不正`); return; }
    if (!s.name || typeof s.name !== 'string') { warnings.push(`${label}: name が不正`); return; }
    if (!WDAY_SET.has(s.weekday)) { warnings.push(`${label}: weekday が不正 (${s.weekday})`); return; }
    if (!Number.isInteger(s.period) || s.period < 1 || s.period > 9) {
      warnings.push(`${label}: period が範囲外 (${s.period})`); return;
    }
    if (!isValidISO(s.startDate)) { warnings.push(`${label}: startDate の形式が不正`); return; }
    if (s.holidays && !Array.isArray(s.holidays)) { warnings.push(`${label}: holidays が配列でない`); return; }
    const holidays = (s.holidays || []).filter(h => {
      if (!isValidISO(h)) { warnings.push(`${label}: holidays に不正な日付 ${h}`); return false; }
      return true;
    });
    validSubjects.push({
      id:        String(s.id),
      name:      String(s.name).slice(0, 60),
      weekday:   s.weekday,
      period:    s.period,
      color:     COLOR_RE.test(s.color) ? s.color : '#5b8af0',
      startDate: s.startDate,
      holidays,
    });
  });

  // Validate exams
  const validExams = [];
  raw.exams.forEach((e, i) => {
    const label = `exams[${i}]`;
    if (!e.id || typeof e.id !== 'string') { warnings.push(`${label}: id が不正`); return; }
    if (!TYPE_SET.has(e.type)) { warnings.push(`${label}: type が不正 (${e.type})`); return; }
    if (!isValidISO(e.date)) { warnings.push(`${label}: date の形式が不正`); return; }
    if (e.startTime && !isValidTime(e.startTime)) { warnings.push(`${label}: startTime の形式が不正`); return; }
    if (e.endTime   && !isValidTime(e.endTime))   { warnings.push(`${label}: endTime の形式が不正`); return; }
    validExams.push({
      id:        String(e.id),
      subjectId: String(e.subjectId || ''),
      type:      e.type,
      date:      e.date,
      ...(e.startTime && { startTime: e.startTime }),
      ...(e.endTime   && { endTime:   e.endTime   }),
      ...(e.room      && { room:  String(e.room).slice(0, 40) }),
      ...(e.note      && { note:  String(e.note).slice(0, 300) }),
    });
  });

  return { valid: true, subjects: validSubjects, exams: validExams, warnings, fatalErrors };
}

function confirmImport(mode) {
  if (!pendingImport) return;
  loadAll();

  let newSubjects, newExams;

  if (mode === 'overwrite') {
    newSubjects = pendingImport.subjects;
    newExams    = pendingImport.exams;
  } else {
    // Merge: existing data + new (new wins on ID conflict)
    const subMap = new Map(subjects.map(s => [s.id, s]));
    pendingImport.subjects.forEach(s => subMap.set(s.id, s));
    newSubjects = [...subMap.values()];

    const exMap = new Map(exams.map(e => [e.id, e]));
    pendingImport.exams.forEach(e => exMap.set(e.id, e));
    newExams = [...exMap.values()];
  }

  localStorage.setItem(KEYS.SUBJECTS, JSON.stringify(newSubjects));
  localStorage.setItem(KEYS.EXAMS,    JSON.stringify(newExams));
  loadAll();

  pendingImport = null;
  closeModal('importModal');

  const label = mode === 'overwrite' ? '上書き' : 'マージ';
  showToast(`${label}完了: 授業${newSubjects.length}件 / テスト${newExams.length}件 ✓`, 'success');

  renderTimetable();
}

// ============================================================
// Modal helpers
// ============================================================
function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ============================================================
// Toast
// ============================================================
let _toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast ${type} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
