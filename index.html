<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TestTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ===== Variables ===== */
:root {
  --bg:          #0c0e14;
  --surface:     #141720;
  --surface2:    #1c2030;
  --surface3:    #242840;
  --border:      #2a2f45;
  --border2:     #353b55;
  --text:        #dde1f0;
  --muted:       #6b7291;
  --accent:      #5b8af0;
  --accent2:     #3d6fe0;
  --accent-bg:   rgba(91,138,240,.12);
  --accent-glow: rgba(91,138,240,.28);
  --green:       #3ecf8e;
  --green-bg:    rgba(62,207,142,.12);
  --red:         #f06b6b;
  --red-bg:      rgba(240,107,107,.1);
  --yellow:      #f0c46b;
  --yellow-bg:   rgba(240,196,107,.1);

  --r:      10px;
  --r-sm:   6px;
  --r-lg:   14px;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
  --trans:  160ms cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:15px; }
body {
  background:var(--bg); color:var(--text);
  font-family:"Zen Kaku Gothic New",sans-serif;
  min-height:100dvh; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 900px 500px at 10% 0%,rgba(91,138,240,.07) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 88% 90%,rgba(62,207,142,.05) 0%,transparent 70%);
  pointer-events:none; z-index:0;
}

/* ===== Page router ===== */
.page { position:relative; z-index:1; display:none; }
.page.active { display:block; }

/* ===== Header ===== */
.page-header {
  display:flex; align-items:center; gap:10px;
  padding:26px 20px 14px; max-width:1100px; margin:0 auto;
  flex-wrap:wrap;
}
.back-btn {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:50%;
  border:1px solid var(--border2); background:var(--surface);
  color:var(--muted); font-size:17px; cursor:pointer;
  transition:var(--trans); flex-shrink:0;
}
.back-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--accent); }
.page-title {
  font-family:"Kaisei Decol",serif; font-size:21px; font-weight:700; letter-spacing:.02em;
}
.page-title span { color:var(--accent); }
.header-right { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

/* ===== Button ===== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  padding:8px 16px; border-radius:var(--r-sm); font-family:inherit;
  font-size:13px; font-weight:700; cursor:pointer; transition:var(--trans);
  border:none; outline:none; letter-spacing:.02em; white-space:nowrap;
}
.btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 16px rgba(91,138,240,.35); }
.btn-primary:hover { background:var(--accent2); box-shadow:0 6px 22px rgba(91,138,240,.5); }
.btn-ghost { background:var(--surface2); border:1px solid var(--border2); color:var(--muted); }
.btn-ghost:hover { color:var(--text); background:var(--surface3); }
.btn-sm { padding:5px 11px; font-size:12px; }

/* ===========================
   PAGE: HOME — Exam list
   =========================== */
.home-wrap { max-width:720px; margin:0 auto; padding:0 16px 80px; }

/* stats bar */
.stats-bar {
  display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.stat-pill {
  display:flex; align-items:center; gap:6px;
  padding:6px 14px; border-radius:999px;
  background:var(--surface2); border:1px solid var(--border);
  font-size:12px; font-family:"JetBrains Mono",monospace;
}
.stat-pill .val { color:var(--text); font-weight:700; }
.stat-pill .lbl { color:var(--muted); }

/* section dividers */
.exam-section { margin-bottom:28px; }
.section-label {
  font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted);
  margin-bottom:12px; display:flex; align-items:center; gap:10px;
}
.section-label::after {
  content:''; flex:1; height:1px; background:var(--border);
}

/* date group */
.date-group { margin-bottom:16px; }
.date-header {
  display:flex; align-items:center; gap:10px; margin-bottom:8px;
}
.date-label {
  font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700;
  color:var(--text);
}
.date-wd {
  font-size:11px; color:var(--muted);
}
.days-badge {
  font-size:11px; font-family:"JetBrains Mono",monospace; font-weight:700;
  padding:2px 9px; border-radius:999px; margin-left:auto;
}
.days-badge.today   { background:rgba(91,138,240,.2); border:1px solid rgba(91,138,240,.5); color:var(--accent); }
.days-badge.soon    { background:rgba(240,107,107,.15); border:1px solid rgba(240,107,107,.4); color:var(--red); }
.days-badge.week    { background:rgba(240,196,107,.12); border:1px solid rgba(240,196,107,.4); color:var(--yellow); }
.days-badge.normal  { background:var(--surface2); border:1px solid var(--border2); color:var(--muted); }

/* exam card */
.exam-row {
  display:flex; align-items:stretch; gap:0;
  border-radius:var(--r); overflow:hidden;
  border:1px solid var(--border);
  background:var(--surface);
  margin-bottom:6px;
  transition:border-color var(--trans), transform var(--trans), box-shadow var(--trans);
  animation:fadeUp .22s ease both;
}
.exam-row:hover {
  border-color:var(--subject-color, var(--border2));
  transform:translateX(2px);
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.exam-row-bar {
  width:4px; flex-shrink:0;
  background:var(--subject-color, var(--accent));
}
.exam-row-body {
  flex:1; padding:12px 14px; display:flex; align-items:center; gap:12px; min-width:0;
}
.exam-row-type {
  font-size:11px; padding:3px 9px; border-radius:999px;
  font-family:"JetBrains Mono",monospace; font-weight:500;
  flex-shrink:0; white-space:nowrap;
}
.exam-row-type.中間テスト { background:rgba(91,138,240,.2);  border:1px solid rgba(91,138,240,.4);  color:#5b8af0; }
.exam-row-type.期末テスト { background:rgba(240,107,107,.2); border:1px solid rgba(240,107,107,.4); color:#f06b6b; }
.exam-row-type.小テスト   { background:rgba(62,207,142,.2);  border:1px solid rgba(62,207,142,.4);  color:#3ecf8e; }
.exam-row-type.定期テスト { background:rgba(240,196,107,.2); border:1px solid rgba(240,196,107,.4); color:#f0c46b; }
.exam-row-info { flex:1; min-width:0; }
.exam-row-subject {
  font-size:14px; font-weight:700; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.exam-row-meta {
  font-size:11px; color:var(--muted); margin-top:2px;
  font-family:"JetBrains Mono",monospace;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.exam-row-actions {
  display:flex; gap:6px; flex-shrink:0; padding-right:12px; align-items:center;
}
.row-edit-btn, .row-del-btn {
  padding:4px 10px; border-radius:var(--r-sm);
  font-size:11px; cursor:pointer; transition:var(--trans); font-family:inherit; font-weight:500;
  border:1px solid transparent;
}
.row-edit-btn {
  background:var(--accent-bg); border-color:var(--accent-glow); color:var(--accent);
}
.row-edit-btn:hover { background:var(--accent); color:#fff; }
.row-del-btn {
  background:var(--red-bg); border-color:var(--red); color:var(--red);
}
.row-del-btn:hover { background:var(--red); color:#fff; }

/* toggle past */
.toggle-past-btn {
  width:100%; padding:10px; text-align:center;
  background:var(--surface2); border:1px solid var(--border); border-radius:var(--r);
  color:var(--muted); font-size:12px; cursor:pointer; transition:var(--trans); font-family:inherit;
}
.toggle-past-btn:hover { background:var(--surface3); color:var(--text); }
.past-section { margin-top:16px; opacity:.55; }
.past-section .exam-row:hover { opacity:.8; }

/* empty */
.empty-state {
  text-align:center; padding:70px 24px;
  color:var(--muted); line-height:2;
}
.empty-icon { font-size:44px; margin-bottom:14px; }
.empty-title { font-family:"Kaisei Decol",serif; font-size:19px; color:var(--text); margin-bottom:8px; }

/* ===========================
   PAGE: SELECT — Timetable grid
   =========================== */
.select-wrap {
  max-width:1100px; margin:0 auto; padding:0 16px 80px;
  overflow-x:auto;
}
.select-hint {
  font-size:13px; color:var(--muted); margin-bottom:16px;
  padding:10px 14px; background:var(--accent-bg);
  border:1px solid var(--accent-glow); border-radius:var(--r-sm);
  display:flex; align-items:center; gap:8px;
}

.tt-grid {
  display:grid;
  grid-template-columns: 52px repeat(5, 1fr);
  gap:6px; min-width:480px;
}
.tt-col-head {
  text-align:center; padding:10px 4px;
  font-size:13px; font-weight:700; letter-spacing:.04em;
  border-radius:var(--r-sm);
  border-bottom:2px solid var(--color, var(--border2));
  color:var(--color, var(--muted));
  background:var(--color-bg, var(--surface2));
}
.tt-col-head .wday { font-size:18px; }
.tt-period {
  display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted);
}
.tt-cell {
  border-radius:var(--r); border:1px solid var(--border);
  background:var(--surface2); min-height:80px;
  position:relative; overflow:hidden;
  transition:border-color var(--trans), transform var(--trans), box-shadow var(--trans);
}
.tt-cell.empty { background:transparent; border-color:var(--border); opacity:.3; }
.tt-cell.has-subject {
  cursor:pointer;
  border-color:var(--subject-color, var(--accent));
  background:var(--surface);
}
.tt-cell.has-subject::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--subject-color, var(--accent)); border-radius:3px 0 0 3px;
}
.tt-cell.has-subject:hover {
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  background:var(--surface3);
  z-index:2;
}
.tt-cell.has-subject:active { transform:translateY(0) scale(1); }
.cell-inner { padding:10px 10px 10px 14px; height:100%; display:flex; flex-direction:column; gap:4px; }
.cell-name { font-size:13px; font-weight:700; line-height:1.3; }
.cell-meta { font-size:10px; color:var(--muted); font-family:"JetBrains Mono",monospace; }
.cell-badge {
  margin-top:auto;
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-family:"JetBrains Mono",monospace;
  padding:2px 7px; border-radius:999px;
  background:var(--subject-color-bg, var(--accent-bg));
  border:1px solid var(--subject-color-border, var(--accent-glow));
  color:var(--subject-color, var(--accent)); width:fit-content;
}
.cell-exam-dot {
  position:absolute; top:8px; right:8px;
  width:8px; height:8px; border-radius:50%;
  background:var(--yellow); box-shadow:0 0 6px rgba(240,196,107,.6);
}

/* ===========================
   PAGE: EXAM — Input form
   =========================== */
.exam-wrap { max-width:680px; margin:0 auto; padding:0 20px 80px; }
.subject-info-card {
  background:var(--surface); border:1px solid var(--border);
  border-left:4px solid var(--subject-color, var(--accent));
  border-radius:var(--r); padding:16px 20px; margin-bottom:20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.sic-name { font-size:17px; font-weight:700; }
.sic-meta { font-size:12px; color:var(--muted); margin-top:3px; font-family:"JetBrains Mono",monospace; }
.sic-badge {
  margin-left:auto; flex-shrink:0;
  font-size:11px; padding:4px 12px; border-radius:999px;
  background:var(--accent-bg); border:1px solid var(--accent-glow); color:var(--accent);
  font-family:"JetBrains Mono",monospace;
}
.form-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:22px; margin-bottom:14px;
}
.form-section-title {
  font-size:11px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.form-section-title::before {
  content:''; display:inline-block; width:3px; height:13px;
  background:var(--accent); border-radius:2px;
}
.field { margin-bottom:13px; }
label { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.06em; margin-bottom:5px; }
input[type=text], input[type=date], input[type=time], select, textarea {
  width:100%; padding:9px 12px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:var(--r-sm); color:var(--text);
  font-family:inherit; font-size:14px;
  transition:border-color var(--trans), box-shadow var(--trans);
  outline:none; appearance:none;
}
input:focus, select:focus, textarea:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);
}
input.error { border-color:var(--red) !important; box-shadow:0 0 0 3px rgba(240,107,107,.2) !important; }
input.warn  { border-color:var(--yellow) !important; box-shadow:0 0 0 3px rgba(240,196,107,.2) !important; }
.field-msg { font-size:11px; margin-top:4px; padding-left:2px; }
.field-msg.error { color:var(--red); }
.field-msg.warn  { color:var(--yellow); }
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator { filter:invert(.5); cursor:pointer; }
select option { background:var(--surface2); }
textarea { resize:vertical; min-height:72px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.type-group { display:flex; gap:6px; flex-wrap:wrap; }
.type-btn {
  padding:7px 14px; border-radius:var(--r-sm);
  border:1px solid var(--border2); background:var(--surface2);
  color:var(--muted); font-family:inherit; font-size:13px; font-weight:500;
  cursor:pointer; transition:var(--trans);
}
.type-btn:hover { background:var(--surface3); color:var(--text); }
.type-btn.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
.form-actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }

/* inline exam list in form */
.exam-list { display:flex; flex-direction:column; gap:8px; }
.ec-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); padding:12px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  animation:fadeUp .22s ease both;
}
.ec-type-badge {
  flex-shrink:0; font-size:11px; padding:3px 10px; border-radius:999px;
  font-family:"JetBrains Mono",monospace; font-weight:500; white-space:nowrap;
}
.ec-type-badge.中間テスト { background:rgba(91,138,240,.2);  border:1px solid rgba(91,138,240,.4);  color:#5b8af0; }
.ec-type-badge.期末テスト { background:rgba(240,107,107,.2); border:1px solid rgba(240,107,107,.4); color:#f06b6b; }
.ec-type-badge.小テスト   { background:rgba(62,207,142,.2);  border:1px solid rgba(62,207,142,.4);  color:#3ecf8e; }
.ec-type-badge.定期テスト { background:rgba(240,196,107,.2); border:1px solid rgba(240,196,107,.4); color:#f0c46b; }
.ec-info { flex:1; min-width:0; }
.ec-date { font-size:13px; font-weight:700; font-family:"JetBrains Mono",monospace; }
.ec-meta { font-size:11px; color:var(--muted); margin-top:2px; }
.ec-del {
  padding:5px 10px; border-radius:var(--r-sm); flex-shrink:0;
  background:var(--red-bg); border:1px solid var(--red); color:var(--red);
  font-size:12px; cursor:pointer; transition:var(--trans); font-family:inherit;
}
.ec-del:hover { background:var(--red); color:#fff; }

/* ===== Modal ===== */
.modal-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.72); backdrop-filter:blur(5px);
  display:flex; align-items:center; justify-content:center; padding:16px;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.modal-overlay.active { opacity:1; pointer-events:all; }
.modal-box {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--r); padding:28px; max-width:440px; width:100%;
  box-shadow:var(--shadow);
  transform:scale(.96) translateY(8px);
  transition:transform .22s cubic-bezier(.34,1.36,.64,1);
}
.modal-overlay.active .modal-box { transform:scale(1) translateY(0); }
.modal-title {
  font-family:"Kaisei Decol",serif; font-size:17px; margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.modal-body { font-size:13px; color:var(--muted); line-height:1.8; margin-bottom:20px; }
.modal-body strong { color:var(--text); }
.modal-stat-row { display:flex; gap:10px; margin:12px 0; }
.modal-stat {
  flex:1; background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:10px 14px; text-align:center;
}
.modal-stat-val { font-family:"JetBrains Mono",monospace; font-size:22px; font-weight:700; color:var(--accent); }
.modal-stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }
.modal-warn {
  background:var(--yellow-bg); border:1px solid rgba(240,196,107,.3);
  border-radius:var(--r-sm); padding:10px 14px;
  font-size:12px; color:var(--yellow); line-height:1.6; margin-bottom:16px;
}
.modal-divider { border:none; border-top:1px solid var(--border); margin:0 0 16px; }
.modal-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* ===== Toast ===== */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--surface2); border:1px solid var(--border2);
  padding:10px 20px; border-radius:999px;
  font-size:13px; font-weight:500; color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  opacity:0; pointer-events:none; z-index:999; white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.success { border-color:var(--green);  color:var(--green); }
.toast.error   { border-color:var(--red);    color:var(--red);   }
.toast.warn    { border-color:var(--yellow); color:var(--yellow);}

/* ===== Animations ===== */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes popIn {
  from { opacity:0; transform:scale(.96) translateY(10px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.tt-cell.has-subject { animation:popIn .26s ease both; }
.exam-row { animation:fadeUp .22s ease both; }

/* ===== Responsive ===== */
@media (max-width:600px) {
  .tt-grid { gap:4px; }
  .cell-inner { padding:7px 7px 7px 11px; }
  .cell-name { font-size:11px; }
  .cell-meta, .cell-badge { display:none; }
  .form-row { grid-template-columns:1fr; }
  .exam-row-actions { padding-right:8px; }
}
</style>
</head>
<body>

<!-- ==================== PAGE: HOME (exam list) ==================== -->
<div class="page active" id="page-home">
  <div class="page-header">
    <h1 class="page-title">Test<span>Track</span></h1>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ 保存</button>
      <button class="btn btn-ghost btn-sm" onclick="triggerImport()">↑ 読込</button>
      <button class="btn btn-primary btn-sm" onclick="navigate('select')">＋ テスト入力</button>
    </div>
  </div>

  <div class="home-wrap">
    <!-- stats -->
    <div class="stats-bar" id="statsBar"></div>
    <!-- upcoming exam list -->
    <div id="homeContent"></div>
  </div>
</div>

<!-- ==================== PAGE: SELECT (timetable grid) ==================== -->
<div class="page" id="page-select">
  <div class="page-header">
    <button class="back-btn" onclick="navigate('home')" title="戻る">←</button>
    <h1 class="page-title">授業を<span>選択</span></h1>
  </div>
  <div class="select-wrap">
    <div class="select-hint">📌 テストを追加したい授業をタップしてください</div>
    <div class="tt-grid" id="ttGrid"></div>
    <div class="empty-state" id="selectEmpty" style="display:none">
      <div class="empty-icon">📋</div>
      <div class="empty-title">授業データがありません</div>
      <p>「読込」ボタンからJSONデータを読み込んでください。</p>
    </div>
  </div>
</div>

<!-- ==================== PAGE: EXAM (input form) ==================== -->
<div class="page" id="page-exam">
  <div class="page-header">
    <button class="back-btn" onclick="navigate('select')" title="授業選択へ">←</button>

<script>
'use strict';

// ============================================================
// Constants
// ============================================================
const KEYS       = { SUBJECTS:'exam_app:subjects', EXAMS:'exam_app:exams' };
const WEEKDAYS   = ['月','火','水','木','金'];
const JS_DAY     = { '月':1,'火':2,'水':3,'木':4,'金':5 };
const EXAM_TYPES = ['中間テスト','期末テスト','小テスト','定期テスト'];
const WD_COLORS  = {
  '月':{ color:'#5b8af0', bg:'rgba(91,138,240,.1)'  },
  '火':{ color:'#3ecf8e', bg:'rgba(62,207,142,.1)'  },
  '水':{ color:'#f0c46b', bg:'rgba(240,196,107,.1)' },
  '木':{ color:'#c97af0', bg:'rgba(201,122,240,.1)' },
  '金':{ color:'#f07a5b', bg:'rgba(240,122,91,.1)'  },
};
const ISO_RE  = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^\d{2}:\d{2}$/;
const COLOR_RE= /^#[0-9a-fA-F]{6}$/;

// ============================================================
// State
// ============================================================
let subjects         = [];
let exams            = [];
let currentSubjectId = null;
let selectedExamType = EXAM_TYPES[0];
let pendingImport    = null;
let showPast         = false;

// ============================================================
// Storage
// ============================================================
function loadAll() {
  try { subjects = JSON.parse(localStorage.getItem(KEYS.SUBJECTS) || '[]'); } catch { subjects = []; }
  try { exams    = JSON.parse(localStorage.getItem(KEYS.EXAMS)    || '[]'); } catch { exams = []; }
}
function persistSubjects() { localStorage.setItem(KEYS.SUBJECTS, JSON.stringify(subjects)); }
function persistExams()    { localStorage.setItem(KEYS.EXAMS,    JSON.stringify(exams));    }
function genId() {
  return typeof crypto !== 'undefined' && crypto.randomUUID
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ============================================================
// Date utilities
// ============================================================
function pad(n)    { return String(n).padStart(2,'0'); }
function toISO(d)  { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayISO(){ return toISO(new Date()); }
function parseISO(iso) {
  if (!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d);
}
function isValidISO(s)  { return ISO_RE.test(s)  && !isNaN(parseISO(s)); }
function isValidTime(s) { return TIME_RE.test(s); }

function fmtDate(iso) {
  if (!iso) return '—';
  const d = parseISO(iso);
  if (!d) return iso;
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}(${wd})`;
}
function fmtDateShort(iso) {
  if (!iso) return '—';
  const d = parseISO(iso);
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}(${wd})`;
}
function daysUntil(iso) {
  const t = parseISO(todayISO()); const v = parseISO(iso);
  return Math.round((v - t) / 86400000);
}
function fmtTime(s, e) { return s ? (e ? `${s}〜${e}` : s) : ''; }

// ============================================================
// Occurrence logic
// ============================================================
function nextOccurrenceDates(s, count=1) {
  const targetDay = JS_DAY[s.weekday];
  const hSet = new Set(s.holidays || []);
  const from = parseISO(todayISO());
  const cur  = new Date(from);
  while (cur.getDay() !== targetDay) cur.setDate(cur.getDate()+1);
  const result = []; let guard = 0;
  while (result.length < count && guard++ < 1000) {
    const iso = toISO(cur);
    if (!hSet.has(iso)) result.push(iso);
    cur.setDate(cur.getDate()+7);
  }
  return result;
}
function getOccurrenceNumber(s, date) {
  const targetDay = JS_DAY[s.weekday];
  const hSet = new Set(s.holidays||[]);
  const cur  = new Date(parseISO(s.startDate));
  while (cur.getDay() !== targetDay) cur.setDate(cur.getDate()+1);
  let count=0, guard=0;
  while (guard++<2000) {
    const iso=toISO(cur);
    if (!hSet.has(iso)) count++;
    if (iso===date) return count;
    if (iso>date)   return null;
    cur.setDate(cur.getDate()+7);
  }
  return null;
}

// ============================================================
// Utilities
// ============================================================
function esc(s) {
  return String(s??'').replace(/[&<>"']/g,
    c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hexToRgba(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function subjectColor(s) { return (s && s.color) || '#5b8af0'; }

// ============================================================
// Router
// ============================================================
function navigate(route, subjectId) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+route).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if (route==='home')   renderHome();
  if (route==='select') renderSelect();
  if (route==='exam')   renderExamPage(subjectId??null);
}

// ============================================================
// PAGE: HOME — upcoming exam list
// ============================================================
function renderHome() {
  loadAll();
  const today = todayISO();

  // Stats
  const upcoming = exams.filter(e=>e.date>=today);
  const statsBar = document.getElementById('statsBar');
  statsBar.innerHTML = `
    <div class="stat-pill"><span class="val">${fmtDate(today).slice(5)}</span><span class="lbl">今日</span></div>
    <div class="stat-pill"><span class="val">${upcoming.length}</span><span class="lbl">件のテスト予定</span></div>
    <div class="stat-pill"><span class="val">${subjects.length}</span><span class="lbl">科目</span></div>
  `;

  const content = document.getElementById('homeContent');

  if (!exams.length) {
    content.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">テストが登録されていません</div>
      <p>「＋ テスト入力」から授業を選んで登録してください。</p>
    </div>`;
    return;
  }

  const futureExams = exams.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  const pastExams   = exams.filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date));

  let html = '';

  if (futureExams.length) {
    html += `<div class="exam-section">
      <div class="section-label">今後のテスト</div>`;
    html += renderDateGroups(futureExams, false);
    html += `</div>`;
  } else {
    html += `<div class="exam-section">
      <div class="section-label">今後のテスト</div>
      <div style="color:var(--muted);font-size:13px;text-align:center;padding:32px 0;">予定はありません</div>
    </div>`;
  }

  if (pastExams.length) {
    html += `<button class="toggle-past-btn" onclick="togglePast(this)">
      ${showPast ? '▲' : '▼'} 過去のテスト（${pastExams.length}件）
    </button>
    <div class="past-section" id="pastSection" style="display:${showPast?'block':'none'}">
      <div class="exam-section" style="margin-top:12px">
        <div class="section-label">過去のテスト</div>
        ${renderDateGroups(pastExams, true)}
      </div>
    </div>`;
  }

  content.innerHTML = html;

  // stagger
  document.querySelectorAll('.exam-row').forEach((el,i)=>{
    el.style.animationDelay=`${i*18}ms`;
  });
}

function renderDateGroups(examList, isPast) {
  // Group by date
  const groups = {};
  examList.forEach(e=>{
    (groups[e.date]=groups[e.date]||[]).push(e);
  });

  return Object.entries(groups).map(([date, group])=>{
    const d = daysUntil(date);
    let badgeClass, badgeText;
    if (isPast) {
      badgeClass='normal'; badgeText=`${Math.abs(d)}日前`;
    } else if (d===0) {
      badgeClass='today'; badgeText='今日';
    } else if (d<=3) {
      badgeClass='soon';  badgeText=`あと${d}日`;
    } else if (d<=7) {
      badgeClass='week';  badgeText=`あと${d}日`;
    } else {
      badgeClass='normal'; badgeText=`あと${d}日`;
    }

    const rows = group.map((e,i) => {
      const s     = subjects.find(s=>s.id===e.subjectId);
      const color = subjectColor(s);
      const meta  = [
        s ? `${s.weekday} ${s.period}限` : '',
        fmtTime(e.startTime, e.endTime),
        e.room || '',
        e.note || '',
      ].filter(Boolean).join('　');

      return `<div class="exam-row" style="--subject-color:${esc(color)};animation-delay:${i*15}ms">
        <div class="exam-row-bar"></div>
        <div class="exam-row-body">
          <span class="exam-row-type ${esc(e.type)}">${esc(e.type)}</span>
          <div class="exam-row-info">
            <div class="exam-row-subject">${s?esc(s.name):'(削除済み授業)'}</div>
            ${meta ? `<div class="exam-row-meta">${esc(meta)}</div>` : ''}
          </div>
        </div>
        <div class="exam-row-actions">
          ${s ? `<button class="row-edit-btn" onclick="navigate('exam','${esc(s.id)}')">編集</button>` : ''}
          <button class="row-del-btn" onclick="deleteExamFromHome('${esc(e.id)}')">削除</button>
        </div>
      </div>`;
    }).join('');

    return `<div class="date-group">
      <div class="date-header">
        <span class="date-label">${fmtDateShort(date)}</span>
        <span class="days-badge ${badgeClass}">${badgeText}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

function togglePast(btn) {
  showPast = !showPast;
  renderHome();
}

function deleteExamFromHome(id) {
  if (!confirm('このテストを削除しますか？')) return;
  exams = exams.filter(e=>e.id!==id);
  persistExams();
  renderHome();
  showToast('削除しました');
}

// ============================================================
// PAGE: SELECT — timetable grid
// ============================================================
function renderSelect() {
  loadAll();
  const grid  = document.getElementById('ttGrid');
  const empty = document.getElementById('selectEmpty');

  if (!subjects.length) {
    grid.style.display='none'; empty.style.display='';
    return;
  }
  grid.style.display='grid'; empty.style.display='none';

  const maxPeriod = Math.max(...subjects.map(s=>s.period),5);
  const lookup={};
  subjects.forEach(s=>{ (lookup[s.weekday]=lookup[s.weekday]||{})[s.period]=s; });

  const today = todayISO();
  // Next exam per subject (upcoming only)
  const nextExamMap={};
  exams.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(e=>{ if(!nextExamMap[e.subjectId]) nextExamMap[e.subjectId]=e; });

  const examSubjectIds = new Set(exams.map(e=>e.subjectId));

  let html='<div></div>';
  WEEKDAYS.forEach(wd=>{
    const c=WD_COLORS[wd];
    html+=`<div class="tt-col-head" style="--color:${c.color};--color-bg:${c.bg}">
      <div class="wday">${wd}</div>
    </div>`;
  });

  for(let pd=1;pd<=maxPeriod;pd++){
    html+=`<div class="tt-period">${pd}限</div>`;
    WEEKDAYS.forEach(wd=>{
      const s=lookup[wd]?.[pd];
      if(!s){ html+=`<div class="tt-cell empty"></div>`; return; }
      const color=subjectColor(s);
      const colorBg=hexToRgba(color,.12);
      const colorBorder=hexToRgba(color,.35);
      const nextDates=nextOccurrenceDates(s,1);
      const nextDate=nextDates[0]||null;
      const nextN=nextDate?getOccurrenceNumber(s,nextDate):null;
      const nx=nextExamMap[s.id];
      const hasExam=examSubjectIds.has(s.id);

      html+=`<div class="tt-cell has-subject"
          style="--subject-color:${color};--subject-color-bg:${colorBg};--subject-color-border:${colorBorder}"
          onclick="navigate('exam','${esc(s.id)}')"
          title="${esc(s.name)}">
        ${hasExam?'<div class="cell-exam-dot"></div>':''}
        <div class="cell-inner">
          <div class="cell-name">${esc(s.name)}</div>
          ${nextDate
            ?`<div class="cell-meta">次: ${fmtDateShort(nextDate)}</div>`
            :`<div class="cell-meta" style="color:var(--red)">次回なし</div>`}
          ${nx
            ?`<div class="cell-badge">📝 ${fmtDateShort(nx.date)}</div>`
            : nextN!==null
              ?`<div class="cell-badge">第${nextN}回</div>`:''}
        </div>
      </div>`;
    });
  }

  grid.innerHTML=html;
  document.querySelectorAll('.tt-cell.has-subject').forEach((el,i)=>{
    el.style.animationDelay=`${i*25}ms`;
  });
}

// ============================================================
// PAGE: EXAM — form
// ============================================================
document.getElementById('typeGroup').addEventListener('click',e=>{
  const btn=e.target.closest('.type-btn');
  if(!btn) return;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedExamType=btn.dataset.type;
});

function renderExamPage(subjectId) {
  loadAll();
  currentSubjectId=subjectId;
  const card=document.getElementById('examSubjectCard');
  const nameEl=document.getElementById('examSubjectName');
  const metaEl=document.getElementById('examSubjectMeta');
  const badge=document.getElementById('examSubjectBadge');

  if(subjectId){
    const s=subjects.find(s=>s.id===subjectId);
    if(s){
      const color=subjectColor(s);
      card.style.setProperty('--subject-color',color);
      nameEl.textContent=s.name;
      metaEl.textContent=`${s.weekday}曜 ${s.period}限 ／ 開始: ${fmtDate(s.startDate)} ／ 休み${(s.holidays||[]).length}日`;
      badge.textContent=`${s.weekday} ${s.period}限`;
      const dateInput=document.getElementById('examDate');
      if(!dateInput.value){
        const next=nextOccurrenceDates(s,1);
        if(next[0]) dateInput.value=next[0];
      }
    } else {
      nameEl.textContent='(授業が見つかりません)';
      metaEl.textContent='';
      badge.textContent='不明';
      card.style.setProperty('--subject-color','var(--red)');
    }
  }
  clearFormMessages();
  renderExamList();
}

function renderExamList() {
  const list=document.getElementById('examList');
  const badge=document.getElementById('examCountBadge');
  const filtered=currentSubjectId
    ? exams.filter(e=>e.subjectId===currentSubjectId)
    : [...exams];
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  badge.textContent=filtered.length?`${filtered.length}件`:'';

  if(!filtered.length){
    list.innerHTML=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px 0;">まだ登録がありません</div>`;
    return;
  }
  const today=todayISO();
  list.innerHTML=filtered.map(e=>{
    const isPast=e.date<today;
    const time=fmtTime(e.startTime,e.endTime);
    return `<div class="ec-card" style="${isPast?'opacity:.6':''}">
      <span class="ec-type-badge ${esc(e.type)}">${esc(e.type)}</span>
      <div class="ec-info">
        <div class="ec-date">${fmtDate(e.date)}${isPast?' <span style="color:var(--muted);font-size:10px">済</span>':''}</div>
        <div class="ec-meta">${[time,e.room?esc(e.room):'',e.note?esc(e.note):''].filter(Boolean).join(' ／ ')}</div>
      </div>
      <button class="ec-del" onclick="deleteExam('${esc(e.id)}')">削除</button>
    </div>`;
  }).join('');
}

// Validation
function clearFormMessages(){
  ['examDate','examStart','examEnd'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('error','warn');
  });
  ['examDateMsg','examTimeMsg'].forEach(id=>{
    const el=document.getElementById(id); if(el){el.textContent='';el.className='field-msg';}
  });
}
function setMsg(id,msg,type){
  const el=document.getElementById(id); if(!el)return;
  el.textContent=msg; el.className=`field-msg ${type}`;
}
function validateDateField(){
  const val=document.getElementById('examDate').value;
  clearFormMessages();
  if(val && val<todayISO()){
    document.getElementById('examDate').classList.add('warn');
    setMsg('examDateMsg','⚠ 過去の日付です','warn');
  }
}
function validateTimeFields(){
  const s=document.getElementById('examStart').value;
  const e=document.getElementById('examEnd').value;
  ['examStart','examEnd'].forEach(id=>document.getElementById(id).classList.remove('error','warn'));
  setMsg('examTimeMsg','','');
  if(e&&!s){
    ['examStart','examEnd'].forEach(id=>document.getElementById(id).classList.add('error'));
    setMsg('examTimeMsg','開始時刻が未入力です','error');
    return false;
  }
  if(s&&e&&s>=e){
    document.getElementById('examEnd').classList.add('warn');
    setMsg('examTimeMsg','⚠ 終了時刻が開始時刻以前です','warn');
  }
  return true;
}

function saveExam(){
  const date =document.getElementById('examDate').value;
  const start=document.getElementById('examStart').value;
  const end  =document.getElementById('examEnd').value;
  clearFormMessages();

  if(!date){
    document.getElementById('examDate').classList.add('error');
    setMsg('examDateMsg','テスト日は必須です','error');
    document.getElementById('examDate').focus();
    return;
  }
  if(end&&!start){
    document.getElementById('examStart').classList.add('error');
    setMsg('examTimeMsg','開始時刻を入力してください','error');
    return;
  }
  if(!validateTimeFields()) return;

  const isDup=exams.some(e=>
    e.subjectId===(currentSubjectId||'') && e.date===date && e.type===selectedExamType
  );
  if(isDup && !confirm('同じ授業・日付・種別のテストがすでに存在します。重複して追加しますか？')) return;

  exams.push({
    id:genId(), subjectId:currentSubjectId||'', type:selectedExamType, date,
    ...(start&&{startTime:start}), ...(end&&{endTime:end}),
    ...(document.getElementById('examRoom').value.trim()&&{room:document.getElementById('examRoom').value.trim()}),
    ...(document.getElementById('examNote').value.trim()&&{note:document.getElementById('examNote').value.trim().slice(0,300)}),
  });
  persistExams();

  ['examStart','examEnd','examRoom'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('examNote').value='';
  clearFormMessages();
  renderExamList();
  showToast('テストを追加しました ✓','success');
}

function deleteExam(id){
  if(!confirm('このテストを削除しますか？')) return;
  exams=exams.filter(e=>e.id!==id);
  persistExams();
  renderExamList();
  showToast('削除しました');
}

// Export / Import
// ============================================================
function exportData(){
  loadAll();
  const blob=new Blob([JSON.stringify({
    _meta:{version:2,app:'TestTrack',exportedAt:new Date().toISOString(),counts:{subjects:subjects.length,exams:exams.length}},
    subjects, exams
  },null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`testtrack_${todayISO().replace(/-/g,'')}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast(`保存しました: 授業${subjects.length}件 / テスト${exams.length}件`,'success');
}

function triggerImport(){
  document.getElementById('importFile').value='';
  document.getElementById('importFile').click();
}

function handleImport(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    let raw;
    try{raw=JSON.parse(e.target.result);}
    catch{return showToast('JSONの解析に失敗しました','error');}
    const result=validateImportPayload(raw);
    if(!result.valid) return showToast(`形式エラー: ${result.fatalErrors[0]}`,'error');

    pendingImport=result;
    loadAll();
    const hasExisting=subjects.length>0||exams.length>0;
    document.getElementById('modalSubCount').textContent=result.subjects.length;
    document.getElementById('modalExamCount').textContent=result.exams.length;
    const wb=document.getElementById('modalWarnBox');
    if(result.warnings.length){wb.style.display='';wb.textContent=`⚠ ${result.warnings.length}件スキップ: ${result.warnings[0]}`;}
    else wb.style.display='none';
    const msg=document.getElementById('modalExistingMsg');
    if(hasExisting){
      msg.innerHTML=`現在 <strong>${subjects.length}</strong>件の授業 / <strong>${exams.length}</strong>件のテストがあります。<br><strong>上書き</strong>: 全置換　<strong>マージ</strong>: IDで差分統合`;
      document.getElementById('modalMergeBtn').style.display='';
    } else {
      msg.textContent='既存データはありません。そのまま読み込みます。';
      document.getElementById('modalMergeBtn').style.display='none';
    }
    openModal('importModal');
  };
  reader.readAsText(file);
}

function validateImportPayload(raw){
  const fatalErrors=[],warnings=[];
  if(!raw||typeof raw!=='object'||Array.isArray(raw))
    return{valid:false,fatalErrors:['ルートがオブジェクトではありません'],warnings,subjects:[],exams:[]};
  if(!Array.isArray(raw.subjects)) fatalErrors.push('"subjects" 配列が必要です');
  if(!Array.isArray(raw.exams))    fatalErrors.push('"exams" 配列が必要です');
  if(fatalErrors.length) return{valid:false,fatalErrors,warnings,subjects:[],exams:[]};

  const WDAY=new Set(WEEKDAYS), TYPE=new Set(EXAM_TYPES);
  const validS=[], validE=[];

  raw.subjects.forEach((s,i)=>{
    const lb=`subjects[${i}]`;
    if(!s.id||!s.name)                          {warnings.push(`${lb}: id/name不正`);return;}
    if(!WDAY.has(s.weekday))                    {warnings.push(`${lb}: weekday不正`);return;}
    if(!Number.isInteger(s.period)||s.period<1) {warnings.push(`${lb}: period不正`);return;}
    if(!isValidISO(s.startDate))                {warnings.push(`${lb}: startDate不正`);return;}
    validS.push({
      id:String(s.id), name:String(s.name).slice(0,60), weekday:s.weekday,
      period:s.period, color:COLOR_RE.test(s.color)?s.color:'#5b8af0',
      startDate:s.startDate,
      holidays:(s.holidays||[]).filter(h=>{if(!isValidISO(h)){warnings.push(`${lb}: holiday不正 ${h}`);return false;}return true;}),
    });
  });
  raw.exams.forEach((e,i)=>{
    const lb=`exams[${i}]`;
    if(!e.id||!TYPE.has(e.type)||!isValidISO(e.date)){warnings.push(`${lb}: 必須フィールド不正`);return;}
    if(e.startTime&&!isValidTime(e.startTime)){warnings.push(`${lb}: startTime不正`);return;}
    if(e.endTime  &&!isValidTime(e.endTime))  {warnings.push(`${lb}: endTime不正`);return;}
    validE.push({
      id:String(e.id), subjectId:String(e.subjectId||''), type:e.type, date:e.date,
      ...(e.startTime&&{startTime:e.startTime}), ...(e.endTime&&{endTime:e.endTime}),
      ...(e.room&&{room:String(e.room).slice(0,40)}),
      ...(e.note&&{note:String(e.note).slice(0,300)}),
    });
  });
  return{valid:true,subjects:validS,exams:validE,warnings,fatalErrors};
}

function confirmImport(mode){
  if(!pendingImport) return;
  loadAll();
  let ns,ne;
  if(mode==='overwrite'){
    ns=pendingImport.subjects; ne=pendingImport.exams;
  } else {
    const sm=new Map(subjects.map(s=>[s.id,s]));
    pendingImport.subjects.forEach(s=>sm.set(s.id,s));
    ns=[...sm.values()];
    const em=new Map(exams.map(e=>[e.id,e]));
    pendingImport.exams.forEach(e=>em.set(e.id,e));
    ne=[...em.values()];
  }
  localStorage.setItem(KEYS.SUBJECTS,JSON.stringify(ns));
  localStorage.setItem(KEYS.EXAMS,   JSON.stringify(ne));
  loadAll(); pendingImport=null; closeModal('importModal');
  showToast(`${mode==='overwrite'?'上書き':'マージ'}完了: 授業${ns.length}件 / テスト${ne.length}件 ✓`,'success');
  renderHome();
}

function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) closeModal(o.id); });
});

// ============================================================
let _tt=null;
function showToast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2800);
}
