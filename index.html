<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TestTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:          #0c0e14;
  --surface:     #141720;
  --surface2:    #1c2030;
  --surface3:    #242840;
  --border:      #2a2f45;
  --border2:     #353b55;
  --text:        #dde1f0;
  --muted:       #6b7291;
  --accent:      #5b8af0;
  --accent2:     #3d6fe0;
  --accent-bg:   rgba(91,138,240,.12);
  --accent-glow: rgba(91,138,240,.28);
  --green:       #3ecf8e;
  --green-bg:    rgba(62,207,142,.12);
  --red:         #f06b6b;
  --red-bg:      rgba(240,107,107,.1);
  --yellow:      #f0c46b;
  --yellow-bg:   rgba(240,196,107,.1);
  --r:6px; --r-md:10px; --r-lg:14px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --trans:160ms cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Zen Kaku Gothic New",sans-serif;
  min-height:100dvh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 900px 500px at 10% 0%,rgba(91,138,240,.07),transparent 70%),
    radial-gradient(ellipse 500px 400px at 88% 90%,rgba(62,207,142,.05),transparent 70%);
}

/* ── Router ── */
.page{position:relative;z-index:1;display:none;}
.page.active{display:block;}

/* ── Header ── */
.hd{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:24px 20px 14px;max-width:1100px;margin:0 auto;
}
.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:17px;cursor:pointer;transition:var(--trans);
}
.back-btn:hover{background:var(--surface2);color:var(--text);border-color:var(--accent);}
.hd-title{
  font-family:"Kaisei Decol",serif;font-size:21px;font-weight:700;letter-spacing:.02em;
}
.hd-title span{color:var(--accent);}
.hd-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

/* ── Button ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 16px;border-radius:var(--r);font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;transition:var(--trans);
  border:none;outline:none;letter-spacing:.02em;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(91,138,240,.35);}
.btn-primary:hover{background:var(--accent2);box-shadow:0 6px 20px rgba(91,138,240,.5);}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);}
.btn-ghost:hover{color:var(--text);background:var(--surface3);}
.btn-danger{background:var(--red-bg);border:1px solid var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-sm{padding:5px 11px;font-size:12px;}

/* ═══════════════════════════════
   PAGE: HOME — view-only list
   ═══════════════════════════════ */
.home-wrap{max-width:720px;margin:0 auto;padding:0 16px 80px;}

.stats-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.stat-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 13px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:12px;font-family:"JetBrains Mono",monospace;
}
.stat-pill .v{color:var(--text);font-weight:700;}
.stat-pill .l{color:var(--muted);}

.section-lbl{
  font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

/* date group */
.date-group{margin-bottom:14px;}
.date-hd{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.date-lbl{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;}
.day-badge{
  font-size:11px;font-family:"JetBrains Mono",monospace;font-weight:700;
  padding:2px 9px;border-radius:999px;margin-left:auto;
}
.day-badge.today {background:rgba(91,138,240,.2);border:1px solid rgba(91,138,240,.5);color:var(--accent);}
.day-badge.soon  {background:rgba(240,107,107,.15);border:1px solid rgba(240,107,107,.4);color:var(--red);}
.day-badge.week  {background:rgba(240,196,107,.12);border:1px solid rgba(240,196,107,.4);color:var(--yellow);}
.day-badge.normal{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);}

/* exam card — view only */
.ev-card{
  display:flex;align-items:stretch;gap:0;
  border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--border);background:var(--surface);
  margin-bottom:6px;
  transition:border-color var(--trans),transform var(--trans);
  animation:fadeUp .2s ease both;
}
.ev-bar{width:4px;flex-shrink:0;background:var(--sc,var(--accent));}
.ev-body{flex:1;padding:11px 14px;display:flex;align-items:center;gap:11px;min-width:0;}
.ev-type{
  font-size:11px;padding:3px 9px;border-radius:999px;
  font-family:"JetBrains Mono",monospace;font-weight:500;flex-shrink:0;white-space:nowrap;
}
.ev-type.中間テスト{background:rgba(91,138,240,.2); border:1px solid rgba(91,138,240,.4); color:#5b8af0;}
.ev-type.期末テスト{background:rgba(240,107,107,.2);border:1px solid rgba(240,107,107,.4);color:#f06b6b;}
.ev-type.小テスト  {background:rgba(62,207,142,.2); border:1px solid rgba(62,207,142,.4); color:#3ecf8e;}
.ev-type.定期テスト{background:rgba(240,196,107,.2);border:1px solid rgba(240,196,107,.4);color:#f0c46b;}
.ev-info{flex:1;min-width:0;}
.ev-subject{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-meta{font-size:11px;color:var(--muted);margin-top:2px;font-family:"JetBrains Mono",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.toggle-btn{
  width:100%;padding:10px;text-align:center;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);
  color:var(--muted);font-size:12px;cursor:pointer;transition:var(--trans);font-family:inherit;
  margin-top:8px;
}
.toggle-btn:hover{background:var(--surface3);color:var(--text);}
.past-wrap{margin-top:12px;opacity:.55;}

.empty-state{text-align:center;padding:70px 24px;color:var(--muted);line-height:2;}
.empty-icon{font-size:44px;margin-bottom:14px;}
.empty-title{font-family:"Kaisei Decol",serif;font-size:19px;color:var(--text);margin-bottom:8px;}

/* ═══════════════════════════════
   PAGE: SELECT — timetable grid
   ═══════════════════════════════ */
.select-wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px;overflow-x:auto;}
.hint-bar{
  font-size:13px;color:var(--muted);margin-bottom:16px;
  padding:10px 14px;background:var(--accent-bg);
  border:1px solid var(--accent-glow);border-radius:var(--r);
  display:flex;align-items:center;gap:8px;
}

.tt-grid{
  display:grid;grid-template-columns:52px repeat(5,1fr);
  gap:6px;min-width:480px;
}
.tt-head{
  text-align:center;padding:10px 4px;font-size:13px;font-weight:700;
  border-radius:var(--r);border-bottom:2px solid var(--c,var(--border2));
  color:var(--c,var(--muted));background:var(--cbg,var(--surface2));
}
.tt-head .wd{font-size:18px;}
.tt-period{
  display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);
}
.tt-cell{
  border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--surface2);min-height:80px;
  position:relative;overflow:hidden;
  transition:border-color var(--trans),transform var(--trans),box-shadow var(--trans);
}
.tt-cell.empty{background:transparent;opacity:.28;}
.tt-cell.has-sub{
  cursor:pointer;border-color:var(--sc,var(--accent));background:var(--surface);
}
.tt-cell.has-sub::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--sc,var(--accent));border-radius:3px 0 0 3px;
}
.tt-cell.has-sub:hover{
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 8px 26px rgba(0,0,0,.5);background:var(--surface3);z-index:2;
}
.tt-cell.has-sub:active{transform:none;}
.ci{padding:10px 10px 10px 14px;height:100%;display:flex;flex-direction:column;gap:4px;}
.ci-name{font-size:13px;font-weight:700;line-height:1.3;}
.ci-meta{font-size:10px;color:var(--muted);font-family:"JetBrains Mono",monospace;}
.ci-badge{
  margin-top:auto;display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-family:"JetBrains Mono",monospace;
  padding:2px 7px;border-radius:999px;
  background:var(--scbg,var(--accent-bg));
  border:1px solid var(--scbd,var(--accent-glow));
  color:var(--sc,var(--accent));width:fit-content;
}
.exam-dot{
  position:absolute;top:8px;right:8px;width:8px;height:8px;
  border-radius:50%;background:var(--yellow);box-shadow:0 0 6px rgba(240,196,107,.6);
}

/* ═══════════════════════════════
   PAGE: MANAGE — exam management
   ═══════════════════════════════ */
.manage-wrap{max-width:700px;margin:0 auto;padding:0 20px 80px;}

/* subject header card */
.sub-card{
  background:var(--surface);border:1px solid var(--border);
  border-left:4px solid var(--sc,var(--accent));
  border-radius:var(--r-md);padding:16px 20px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.sub-card-name{font-size:17px;font-weight:700;}
.sub-card-meta{font-size:12px;color:var(--muted);margin-top:3px;font-family:"JetBrains Mono",monospace;}
.sub-card-badge{
  margin-left:auto;flex-shrink:0;
  font-size:11px;padding:4px 12px;border-radius:999px;
  background:var(--accent-bg);border:1px solid var(--accent-glow);color:var(--accent);
  font-family:"JetBrains Mono",monospace;
}

/* panel */
.panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:22px;margin-bottom:14px;
}
.panel-title{
  font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.panel-title::before{
  content:'';display:inline-block;width:3px;height:13px;
  background:var(--accent);border-radius:2px;
}
.panel-title-right{margin-left:auto;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;}

/* exam management list */
.manage-list{display:flex;flex-direction:column;gap:8px;}
.mc{
  border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface2);
  overflow:hidden;transition:border-color var(--trans);
  animation:fadeUp .2s ease both;
}
.mc.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.mc-top{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;}
.mc-type{
  font-size:11px;padding:3px 9px;border-radius:999px;flex-shrink:0;
  font-family:"JetBrains Mono",monospace;font-weight:500;white-space:nowrap;
}
.mc-type.中間テスト{background:rgba(91,138,240,.2); border:1px solid rgba(91,138,240,.4); color:#5b8af0;}
.mc-type.期末テスト{background:rgba(240,107,107,.2);border:1px solid rgba(240,107,107,.4);color:#f06b6b;}
.mc-type.小テスト  {background:rgba(62,207,142,.2); border:1px solid rgba(62,207,142,.4); color:#3ecf8e;}
.mc-type.定期テスト{background:rgba(240,196,107,.2);border:1px solid rgba(240,196,107,.4);color:#f0c46b;}
.mc-info{flex:1;min-width:0;}
.mc-date{font-size:13px;font-weight:700;font-family:"JetBrains Mono",monospace;}
.mc-note{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc-btns{display:flex;gap:6px;flex-shrink:0;}
.ic-btn{
  padding:4px 10px;border-radius:var(--r);font-size:11px;
  cursor:pointer;transition:var(--trans);font-family:inherit;font-weight:600;
  border:1px solid transparent;
}
.ic-edit{background:var(--accent-bg);border-color:var(--accent-glow);color:var(--accent);}
.ic-edit:hover{background:var(--accent);color:#fff;}
.ic-del{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.ic-del:hover{background:var(--red);color:#fff;}

/* inline edit area */
.mc-edit-area{
  border-top:1px solid var(--border);padding:16px 14px;
  background:var(--surface);display:none;
}
.mc.editing .mc-edit-area{display:block;}

/* add/edit form */
.field{margin-bottom:12px;}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-bottom:5px;}
input[type=text],input[type=date],input[type=time],textarea{
  width:100%;padding:9px 12px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);
  font-family:inherit;font-size:14px;
  transition:border-color var(--trans),box-shadow var(--trans);
  outline:none;appearance:none;
}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
input.err{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(240,107,107,.2)!important;}
input.wrn{border-color:var(--yellow)!important;box-shadow:0 0 0 3px rgba(240,196,107,.2)!important;}
.fmsg{font-size:11px;margin-top:4px;}
.fmsg.err{color:var(--red);}
.fmsg.wrn{color:var(--yellow);}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.5);cursor:pointer;}
textarea{resize:vertical;min-height:64px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-grp{display:flex;gap:6px;flex-wrap:wrap;}
.type-btn{
  padding:6px 13px;border-radius:var(--r);
  border:1px solid var(--border2);background:var(--surface2);
  color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;transition:var(--trans);
}
.type-btn:hover{background:var(--surface3);color:var(--text);}
.type-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
.form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center;}
.cancel-link{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;margin-left:4px;}
.cancel-link:hover{color:var(--text);}
.edit-mode-banner{
  font-size:12px;color:var(--accent);background:var(--accent-bg);
  border:1px solid var(--accent-glow);border-radius:var(--r);
  padding:7px 12px;margin-bottom:12px;display:none;
  align-items:center;gap:8px;
}
.edit-mode-banner.visible{display:flex;}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.72);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-overlay.active{opacity:1;pointer-events:all;}
.modal-box{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r-md);padding:28px;max-width:440px;width:100%;
  box-shadow:var(--shadow);
  transform:scale(.96) translateY(8px);
  transition:transform .22s cubic-bezier(.34,1.36,.64,1);
}
.modal-overlay.active .modal-box{transform:scale(1) translateY(0);}
.modal-title{font-family:"Kaisei Decol",serif;font-size:17px;margin-bottom:14px;}
.modal-body{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:20px;}
.modal-body strong{color:var(--text);}
.modal-stat-row{display:flex;gap:10px;margin:12px 0;}
.modal-stat{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 14px;text-align:center;
}
.modal-stat-val{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;color:var(--accent);}
.modal-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
.modal-warn{
  background:var(--yellow-bg);border:1px solid rgba(240,196,107,.3);
  border-radius:var(--r);padding:10px 14px;
  font-size:12px;color:var(--yellow);line-height:1.6;margin-bottom:16px;
}
.modal-hr{border:none;border-top:1px solid var(--border);margin:0 0 16px;}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--border2);
  padding:10px 20px;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--text);
  box-shadow:var(--shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  opacity:0;pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error  {border-color:var(--red);  color:var(--red);}
.toast.warn   {border-color:var(--yellow);color:var(--yellow);}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.tt-cell.has-sub{animation:popIn .26s ease both;}

@media(max-width:600px){
  .tt-grid{gap:4px;}
  .ci{padding:7px 7px 7px 11px;}
  .ci-name{font-size:11px;}
  .ci-meta,.ci-badge{display:none;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     PAGE: HOME — view-only exam list
     ═══════════════════════════════════════ -->
<div class="page active" id="page-home">
  <div class="hd">
    <h1 class="hd-title">Test<span>Track</span></h1>
    <div class="hd-right">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">↓ 保存</button>
      <button class="btn btn-ghost btn-sm" onclick="triggerImport()">↑ 読込</button>
      <button class="btn btn-primary btn-sm" onclick="navigate('select')">テストの追加・編集</button>
    </div>
  </div>
  <div class="home-wrap">
    <div class="stats-bar" id="statsBar"></div>
    <div id="homeContent"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     PAGE: SELECT — timetable grid
     ═══════════════════════════════════════ -->
<div class="page" id="page-select">
  <div class="hd">
    <button class="back-btn" onclick="navigate('home')">←</button>
    <h1 class="hd-title">授業を<span>選択</span></h1>
  </div>
  <div class="select-wrap">
    <div class="hint-bar">📌 テストを管理したい授業をタップしてください</div>
    <div class="tt-grid" id="ttGrid"></div>
    <div class="empty-state" id="selectEmpty" style="display:none">
      <div class="empty-icon">📋</div>
      <div class="empty-title">授業データがありません</div>
      <p>「読込」から JSON を読み込んでください。</p>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     PAGE: MANAGE — per-subject management
     ═══════════════════════════════════════ -->
<div class="page" id="page-manage">
  <div class="hd">
    <button class="back-btn" onclick="navigate('select')">←</button>
    <h1 class="hd-title" id="manageTitle">テスト<span>管理</span></h1>
  </div>
  <div class="manage-wrap">

    <!-- subject info -->
    <div class="sub-card" id="subCard" style="--sc:var(--accent)">
      <div style="flex:1;min-width:0">
        <div class="sub-card-name" id="subName">—</div>
        <div class="sub-card-meta" id="subMeta">—</div>
      </div>
      <div class="sub-card-badge" id="subBadge">—</div>
    </div>

    <!-- registered exams -->
    <div class="panel" id="examListPanel">
      <div class="panel-title">
        登録済みテスト
        <span class="panel-title-right" id="examCountBadge"></span>

    <!-- add / edit form -->

<script>
'use strict';
// ─── Constants ───────────────────────────────────────────────
const KEYS       = {SUBJECTS:'exam_app:subjects',EXAMS:'exam_app:exams'};
const WEEKDAYS   = ['月','火','水','木','金'];
const JS_DAY     = {'月':1,'火':2,'水':3,'木':4,'金':5};
const EXAM_TYPES = ['中間テスト','期末テスト','小テスト','定期テスト'];
const WD_COL     = {
  '月':{c:'#5b8af0',bg:'rgba(91,138,240,.1)'},
  '火':{c:'#3ecf8e',bg:'rgba(62,207,142,.1)'},
  '水':{c:'#f0c46b',bg:'rgba(240,196,107,.1)'},
  '木':{c:'#c97af0',bg:'rgba(201,122,240,.1)'},
  '金':{c:'#f07a5b',bg:'rgba(240,122,91,.1)'},
};
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/,TIME_RE=/^\d{2}:\d{2}$/,COLOR_RE=/^#[0-9a-fA-F]{6}$/;

// ─── State ───────────────────────────────────────────────────
let subjects=[],exams=[],currentSub=null,editingId=null,selectedType=EXAM_TYPES[0],showPast=false,pendingImport=null;

// ─── Storage ─────────────────────────────────────────────────
function loadAll(){
  try{subjects=JSON.parse(localStorage.getItem(KEYS.SUBJECTS)||'[]');}catch{subjects=[];}
  try{exams=JSON.parse(localStorage.getItem(KEYS.EXAMS)||'[]');}catch{exams=[];}
}
function save(){
  localStorage.setItem(KEYS.SUBJECTS,JSON.stringify(subjects));
  localStorage.setItem(KEYS.EXAMS,JSON.stringify(exams));
}
function genId(){
  return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
}

// ─── Date utils ──────────────────────────────────────────────
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayISO(){return toISO(new Date());}
function parseISO(iso){if(!iso)return null;const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function isValidISO(s){return ISO_RE.test(s)&&!isNaN(parseISO(s));}
function isValidTime(s){return TIME_RE.test(s);}
function daysUntil(iso){return Math.round((parseISO(iso)-parseISO(todayISO()))/86400000);}
function fmtDate(iso){
  if(!iso)return'—';
  const d=parseISO(iso);
  const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}(${w})`;
}
function fmtShort(iso){
  if(!iso)return'—';
  const d=parseISO(iso);
  const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())}(${w})`;
}
function fmtTime(s,e){return s?(e?`${s}〜${e}`:s):'';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function sColor(s){return(s&&s.color)||'#5b8af0';}

// ─── Occurrence ───────────────────────────────────────────────
function nextDates(s,n=1){
  const td=JS_DAY[s.weekday],hs=new Set(s.holidays||[]),cur=new Date(parseISO(todayISO()));
  while(cur.getDay()!==td)cur.setDate(cur.getDate()+1);
  const r=[];let g=0;
  while(r.length<n&&g++<1000){const iso=toISO(cur);if(!hs.has(iso))r.push(iso);cur.setDate(cur.getDate()+7);}
  return r;
}
function occNum(s,date){
  const td=JS_DAY[s.weekday],hs=new Set(s.holidays||[]),cur=new Date(parseISO(s.startDate));
  while(cur.getDay()!==td)cur.setDate(cur.getDate()+1);
  let cnt=0,g=0;
  while(g++<2000){const iso=toISO(cur);if(!hs.has(iso))cnt++;if(iso===date)return cnt;if(iso>date)return null;cur.setDate(cur.getDate()+7);}
  return null;
}

// ─── Router ───────────────────────────────────────────────────
function navigate(route,subjectId){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+route).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if(route==='home')   renderHome();
  if(route==='select') renderSelect();
  if(route==='manage') renderManage(subjectId??null);
}

// ═══════════════════════════════
// PAGE: HOME
// ═══════════════════════════════
function renderHome(){
  loadAll();
  const today=todayISO();
  const upcoming=exams.filter(e=>e.date>=today);
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-pill"><span class="v">${fmtShort(today)}</span><span class="l">今日</span></div>
    <div class="stat-pill"><span class="v">${upcoming.length}</span><span class="l">件のテスト予定</span></div>
    <div class="stat-pill"><span class="v">${subjects.length}</span><span class="l">科目</span></div>`;

  const ct=document.getElementById('homeContent');
  if(!exams.length){
    ct.innerHTML=`<div class="empty-state"><div class="empty-icon">📭</div>
      <div class="empty-title">テストが登録されていません</div>
      <p>「テストの追加・編集」から授業を選んで登録してください。</p></div>`;
    return;
  }

  const future=exams.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  const past  =exams.filter(e=>e.date<today) .sort((a,b)=>b.date.localeCompare(a.date));
  let html='';

  if(future.length){
    html+=`<div><div class="section-lbl">今後のテスト</div>${buildGroups(future,false)}</div>`;
  }else{
    html+=`<div><div class="section-lbl">今後のテスト</div>
      <div style="color:var(--muted);font-size:13px;text-align:center;padding:32px 0;">予定はありません</div></div>`;
  }

  if(past.length){
    html+=`<button class="toggle-btn" onclick="togglePast()">${showPast?'▲':'▼'} 過去のテスト（${past.length}件）</button>
      <div class="past-wrap" id="pastWrap" style="display:${showPast?'block':'none'}">
        <div class="section-lbl" style="margin-top:14px">過去のテスト</div>
        ${buildGroups(past,true)}</div>`;
  }

  ct.innerHTML=html;
  ct.querySelectorAll('.ev-card').forEach((el,i)=>{el.style.animationDelay=`${i*16}ms`;});
}

function buildGroups(list,isPast){
  const groups={};
  list.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  return Object.entries(groups).map(([date,grp])=>{
    const d=daysUntil(date);
    let bc,bt;
    if(isPast){bc='normal';bt=`${Math.abs(d)}日前`;}
    else if(d===0){bc='today';bt='今日';}
    else if(d<=3){bc='soon';bt=`あと${d}日`;}
    else if(d<=7){bc='week';bt=`あと${d}日`;}
    else{bc='normal';bt=`あと${d}日`;}

    const rows=grp.map((e,i)=>{
      const s=subjects.find(s=>s.id===e.subjectId);
      const col=sColor(s);
      const meta=[s?`${s.weekday} ${s.period}限`:'',fmtTime(e.startTime,e.endTime),e.room||'',e.note||''].filter(Boolean).join('　');
      return `<div class="ev-card" style="--sc:${esc(col)};animation-delay:${i*14}ms">
        <div class="ev-bar"></div>
        <div class="ev-body">
          <span class="ev-type ${esc(e.type)}">${esc(e.type)}</span>
          <div class="ev-info">
            <div class="ev-subject">${s?esc(s.name):'(削除済み授業)'}</div>
            ${meta?`<div class="ev-meta">${esc(meta)}</div>`:''}
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="date-group">
      <div class="date-hd">
        <span class="date-lbl">${fmtDate(date)}</span>
        <span class="day-badge ${bc}">${bt}</span>
      </div>${rows}</div>`;
  }).join('');
}

function togglePast(){
  showPast=!showPast;
  const w=document.getElementById('pastWrap');
  if(w){w.style.display=showPast?'block':'none';}
  const b=document.querySelector('.toggle-btn');
  if(b){const c=exams.filter(e=>e.date<todayISO()).length;b.textContent=`${showPast?'▲':'▼'} 過去のテスト（${c}件）`;}
}

// ═══════════════════════════════
// PAGE: SELECT (timetable)
// ═══════════════════════════════
function renderSelect(){
  loadAll();
  const grid=document.getElementById('ttGrid'),empty=document.getElementById('selectEmpty');
  if(!subjects.length){grid.style.display='none';empty.style.display='';return;}
  grid.style.display='grid';empty.style.display='none';

  const maxP=Math.max(...subjects.map(s=>s.period),5);
  const lk={};subjects.forEach(s=>(lk[s.weekday]=lk[s.weekday]||{})[s.period]=s);
  const today=todayISO();
  const nxMap={};
  exams.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(e=>{if(!nxMap[e.subjectId])nxMap[e.subjectId]=e;});
  const hasExam=new Set(exams.map(e=>e.subjectId));

  let h='<div></div>';
  WEEKDAYS.forEach(wd=>{
    const c=WD_COL[wd];
    h+=`<div class="tt-head" style="--c:${c.c};--cbg:${c.bg}"><div class="wd">${wd}</div></div>`;
  });

  for(let pd=1;pd<=maxP;pd++){
    h+=`<div class="tt-period">${pd}限</div>`;
    WEEKDAYS.forEach(wd=>{
      const s=lk[wd]?.[pd];
      if(!s){h+=`<div class="tt-cell empty"></div>`;return;}
      const col=sColor(s);
      const cbg=rgba(col,.12),cbd=rgba(col,.35);
      const nd=nextDates(s,1);
      const nDate=nd[0]||null;
      const nN=nDate?occNum(s,nDate):null;
      const nx=nxMap[s.id];
      h+=`<div class="tt-cell has-sub"
          style="--sc:${col};--scbg:${cbg};--scbd:${cbd}"
          onclick="navigate('manage','${esc(s.id)}')"
          title="${esc(s.name)}">
        ${hasExam.has(s.id)?'<div class="exam-dot"></div>':''}
        <div class="ci">
          <div class="ci-name">${esc(s.name)}</div>
          ${nDate?`<div class="ci-meta">次: ${fmtShort(nDate)}</div>`:`<div class="ci-meta" style="color:var(--red)">次回なし</div>`}
          ${nx?`<div class="ci-badge">📝 ${fmtShort(nx.date)}</div>`:nN!==null?`<div class="ci-badge">第${nN}回</div>`:''}
        </div>
      </div>`;
    });
  }

  grid.innerHTML=h;
  grid.querySelectorAll('.tt-cell.has-sub').forEach((el,i)=>{el.style.animationDelay=`${i*22}ms`;});
}

// ═══════════════════════════════
// PAGE: MANAGE
// ═══════════════════════════════
document.getElementById('typeGrp').addEventListener('click',e=>{
  const b=e.target.closest('.type-btn');if(!b)return;
  document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');selectedType=b.dataset.type;
});

function renderManage(subjectId){
  loadAll();
  cancelEdit();
  currentSub=subjectId;

  const s=subjectId?subjects.find(x=>x.id===subjectId):null;
  const col=sColor(s);

  // subject card
  const card=document.getElementById('subCard');
  card.style.setProperty('--sc',col);
  document.getElementById('subName').textContent=s?s.name:'(授業不明)';
  document.getElementById('subMeta').textContent=s
    ?`${s.weekday}曜 ${s.period}限 ／ 開始: ${fmtDate(s.startDate)} ／ 休み${(s.holidays||[]).length}日`:'';
  document.getElementById('subBadge').textContent=s?`${s.weekday} ${s.period}限`:'—';
  document.getElementById('manageTitle').innerHTML=`${s?esc(s.name):'テスト'}<span>管理</span>`;

  // pre-fill date with next class
  const dateIn=document.getElementById('fDate');
  if(!dateIn.value&&s){const nd=nextDates(s,1);if(nd[0])dateIn.value=nd[0];}

  renderManageList();
}

function renderManageList(){
  const list=document.getElementById('manageList');
  const badge=document.getElementById('examCountBadge');
  const all=currentSub?exams.filter(e=>e.subjectId===currentSub):[...exams];
  all.sort((a,b)=>a.date.localeCompare(b.date));
  badge.textContent=all.length?`${all.length}件`:'';

  if(!all.length){
    list.innerHTML=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:18px 0;">まだ登録がありません</div>`;
    return;
  }

  const today=todayISO();
  list.innerHTML=all.map((e,i)=>{
    const isPast=e.date<today;
    const time=fmtTime(e.startTime,e.endTime);
    const note=[time,e.room?esc(e.room):'',e.note?esc(e.note):''].filter(Boolean).join(' ／ ');
    const isEditing=editingId===e.id;
    return `<div class="mc${isEditing?' editing':''}" id="mc-${esc(e.id)}" style="${isPast?'opacity:.6':''}">
      <div class="mc-top">
        <span class="mc-type ${esc(e.type)}">${esc(e.type)}</span>
        <div class="mc-info">
          <div class="mc-date">${fmtDate(e.date)}${isPast?' <span style="color:var(--muted);font-size:10px">済</span>':''}</div>
          ${note?`<div class="mc-note">${note}</div>`:''}
        </div>
        <div class="mc-btns">
          <button class="ic-btn ic-edit" onclick="startEdit('${esc(e.id)}')">編集</button>
          <button class="ic-btn ic-del"  onclick="deleteExam('${esc(e.id)}')">削除</button>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.mc').forEach((el,i)=>{el.style.animationDelay=`${i*14}ms`;});
}

function startEdit(id){
  const e=exams.find(x=>x.id===id);if(!e)return;
  editingId=id;

  // populate form
  setType(e.type);
  document.getElementById('fDate').value =e.date||'';
  document.getElementById('fStart').value=e.startTime||'';
  document.getElementById('fEnd').value  =e.endTime||'';
  document.getElementById('fRoom').value =e.room||'';
  document.getElementById('fNote').value =e.note||'';

  // show edit banner
  const banner=document.getElementById('editBanner');
  banner.classList.add('visible');
  document.getElementById('editBannerDate').textContent=fmtDate(e.date);
  document.getElementById('submitBtn').textContent='✓ 更新する';
  document.getElementById('formTitle').textContent='テストを編集';

  // scroll to form
  document.getElementById('formPanel').scrollIntoView({behavior:'smooth',block:'start'});

  renderManageList();
}

function cancelEdit(){
  editingId=null;
  document.getElementById('editBanner')?.classList.remove('visible');
  const sb=document.getElementById('submitBtn');if(sb)sb.textContent='＋ 追加する';
  const ft=document.getElementById('formTitle');if(ft)ft.textContent='テストを追加';
  clearFormMsgs();
  if(document.getElementById('fDate')) document.getElementById('fDate').value='';
  if(document.getElementById('fStart'))document.getElementById('fStart').value='';
  if(document.getElementById('fEnd'))  document.getElementById('fEnd').value='';
  if(document.getElementById('fRoom')) document.getElementById('fRoom').value='';
  if(document.getElementById('fNote')) document.getElementById('fNote').value='';
  setType(EXAM_TYPES[0]);
  if(currentSub){const nd=nextDates(subjects.find(s=>s.id===currentSub)||{},1);if(nd[0])document.getElementById('fDate').value=nd[0];}
  renderManageList();
}

function setType(t){
  document.querySelectorAll('.type-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.type===t);
  });
  selectedType=t;
}

function submitExam(){
  const date =document.getElementById('fDate').value;
  const start=document.getElementById('fStart').value;
  const end  =document.getElementById('fEnd').value;
  clearFormMsgs();

  if(!date){
    document.getElementById('fDate').classList.add('err');
    setFMsg('fDateMsg','テスト日は必須です','err');
    document.getElementById('fDate').focus();
    return;
  }
  if(end&&!start){
    document.getElementById('fStart').classList.add('err');
    setFMsg('fTimeMsg','開始時刻を入力してください','err');
    return;
  }
  if(start&&end&&start>=end){
    document.getElementById('fEnd').classList.add('wrn');
    setFMsg('fTimeMsg','⚠ 終了時刻が開始時刻以前です','wrn');
  }

  if(editingId){
    // update
    const idx=exams.findIndex(e=>e.id===editingId);
    if(idx<0)return;
    exams[idx]={
      ...exams[idx],type:selectedType,date,
      ...(start?{startTime:start}:{startTime:undefined}),
      ...(end?{endTime:end}:{endTime:undefined}),
      ...(document.getElementById('fRoom').value.trim()?{room:document.getElementById('fRoom').value.trim()}:{room:undefined}),
      ...(document.getElementById('fNote').value.trim()?{note:document.getElementById('fNote').value.trim()}:{note:undefined}),
    };
    // strip undefined
    Object.keys(exams[idx]).forEach(k=>exams[idx][k]===undefined&&delete exams[idx][k]);
    save();
    showToast('テストを更新しました ✓','success');
    cancelEdit();
  } else {
    // check dup
    const isDup=exams.some(e=>e.subjectId===(currentSub||'')&&e.date===date&&e.type===selectedType);
    if(isDup&&!confirm('同じ授業・日付・種別のテストがすでに存在します。重複して追加しますか？'))return;

    exams.push({
      id:genId(),subjectId:currentSub||'',type:selectedType,date,
      ...(start&&{startTime:start}),
      ...(end&&{endTime:end}),
      ...(document.getElementById('fRoom').value.trim()&&{room:document.getElementById('fRoom').value.trim()}),
      ...(document.getElementById('fNote').value.trim()&&{note:document.getElementById('fNote').value.trim().slice(0,300)}),
    });
    save();
    // reset fields
    ['fStart','fEnd','fRoom'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fNote').value='';
    clearFormMsgs();
    showToast('テストを追加しました ✓','success');
    renderManageList();
  }
}

function deleteExam(id){
  if(!confirm('このテストを削除しますか？'))return;
  if(editingId===id)cancelEdit();
  exams=exams.filter(e=>e.id!==id);
  save();
  renderManageList();
  showToast('削除しました');
}

// ─── Form validation ─────────────────────────────────────────
function clearFormMsgs(){
  ['fDate','fStart','fEnd'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('err','wrn');});
  ['fDateMsg','fTimeMsg'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent='';el.className='fmsg';}});
}
function setFMsg(id,msg,cls){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className=`fmsg ${cls}`;}
function valDate(){
  clearFormMsgs();
  const v=document.getElementById('fDate').value;
  if(v&&v<todayISO()){document.getElementById('fDate').classList.add('wrn');setFMsg('fDateMsg','⚠ 過去の日付です','wrn');}
}
function valTime(){
  const s=document.getElementById('fStart').value,e=document.getElementById('fEnd').value;
  ['fStart','fEnd'].forEach(id=>document.getElementById(id).classList.remove('err','wrn'));
  setFMsg('fTimeMsg','','');
  if(e&&!s){['fStart','fEnd'].forEach(id=>document.getElementById(id).classList.add('err'));setFMsg('fTimeMsg','開始時刻が未入力です','err');}
  else if(s&&e&&s>=e){document.getElementById('fEnd').classList.add('wrn');setFMsg('fTimeMsg','⚠ 終了時刻が開始時刻以前です','wrn');}
}

function exportData(){
  loadAll();
  const blob=new Blob([JSON.stringify({_meta:{version:2,app:'TestTrack',exportedAt:new Date().toISOString()},subjects,exams},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`testtrack_${todayISO().replace(/-/g,'')}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast(`保存: 授業${subjects.length}件 / テスト${exams.length}件`,'success');
}
function triggerImport(){document.getElementById('importFile').value='';document.getElementById('importFile').click();}
function handleImport(ev){
  const file=ev.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{
    let raw;try{raw=JSON.parse(e.target.result);}catch{return showToast('JSONの解析に失敗しました','error');}
    const res=validatePayload(raw);
    if(!res.valid)return showToast(`形式エラー: ${res.fatal[0]}`,'error');
    pendingImport=res;loadAll();
    const has=subjects.length>0||exams.length>0;
    document.getElementById('mSubCnt').textContent=res.subjects.length;
    document.getElementById('mExmCnt').textContent=res.exams.length;
    const mw=document.getElementById('mWarn');
    if(res.warns.length){mw.style.display='';mw.textContent=`⚠ ${res.warns.length}件スキップ: ${res.warns[0]}`;}else mw.style.display='none';
    document.getElementById('mMsg').innerHTML=has
      ?`現在 <strong>${subjects.length}</strong>件の授業 / <strong>${exams.length}</strong>件のテスト<br><strong>上書き</strong>: 全置換　<strong>マージ</strong>: 差分統合`
      :'既存データはありません。そのまま読み込みます。';
    document.getElementById('mMergeBtn').style.display=has?'':'none';
    openModal('importModal');
  };
  rd.readAsText(file);
}
function validatePayload(raw){
  const fatal=[],warns=[];
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return{valid:false,fatal:['ルートがオブジェクトではありません'],warns,subjects:[],exams:[]};
  if(!Array.isArray(raw.subjects))fatal.push('"subjects"配列が必要');
  if(!Array.isArray(raw.exams))   fatal.push('"exams"配列が必要');
  if(fatal.length)return{valid:false,fatal,warns,subjects:[],exams:[]};
  const WS=new Set(WEEKDAYS),TS=new Set(EXAM_TYPES),vs=[],ve=[];
  raw.subjects.forEach((s,i)=>{
    const lb=`subjects[${i}]`;
    if(!s.id||!s.name){warns.push(`${lb}: id/name不正`);return;}
    if(!WS.has(s.weekday)){warns.push(`${lb}: weekday不正`);return;}
    if(!Number.isInteger(s.period)||s.period<1){warns.push(`${lb}: period不正`);return;}
    if(!isValidISO(s.startDate)){warns.push(`${lb}: startDate不正`);return;}
    vs.push({id:String(s.id),name:String(s.name).slice(0,60),weekday:s.weekday,period:s.period,
      color:COLOR_RE.test(s.color)?s.color:'#5b8af0',startDate:s.startDate,
      holidays:(s.holidays||[]).filter(h=>{if(!isValidISO(h)){warns.push(`${lb}: holiday不正`);return false;}return true;})});
  });
  raw.exams.forEach((e,i)=>{
    const lb=`exams[${i}]`;
    if(!e.id||!TS.has(e.type)||!isValidISO(e.date)){warns.push(`${lb}: 必須フィールド不正`);return;}
    if(e.startTime&&!isValidTime(e.startTime)){warns.push(`${lb}: startTime不正`);return;}
    if(e.endTime  &&!isValidTime(e.endTime))  {warns.push(`${lb}: endTime不正`);return;}
    ve.push({id:String(e.id),subjectId:String(e.subjectId||''),type:e.type,date:e.date,
      ...(e.startTime&&{startTime:e.startTime}),
      ...(e.endTime  &&{endTime:e.endTime}),
      ...(e.room&&{room:String(e.room).slice(0,40)}),
      ...(e.note&&{note:String(e.note).slice(0,300)})});
  });
  return{valid:true,subjects:vs,exams:ve,warns,fatal};
}
function confirmImport(mode){
  if(!pendingImport)return;
  loadAll();
  let ns,ne;
  if(mode==='overwrite'){ns=pendingImport.subjects;ne=pendingImport.exams;}
  else{
    const sm=new Map(subjects.map(s=>[s.id,s]));pendingImport.subjects.forEach(s=>sm.set(s.id,s));ns=[...sm.values()];
    const em=new Map(exams.map(e=>[e.id,e]));pendingImport.exams.forEach(e=>em.set(e.id,e));ne=[...em.values()];
  }
  localStorage.setItem(KEYS.SUBJECTS,JSON.stringify(ns));
  localStorage.setItem(KEYS.EXAMS,   JSON.stringify(ne));
  loadAll();pendingImport=null;closeModal('importModal');
  showToast(`${mode==='overwrite'?'上書き':'マージ'}完了: 授業${ns.length}件 / テスト${ne.length}件 ✓`,'success');
  renderHome();
}
function openModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);}));

// ─── Toast ───────────────────────────────────────────────────
let _tt=null;
function showToast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);
}
